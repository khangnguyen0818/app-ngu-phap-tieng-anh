{id:"i8",lv:2,t:"Must, Mustn't, Have to",vi:"Phải, không được phép",
pic:{type:"grid",items:[["⛑️","You must wear a helmet.","bắt buộc"],["🚫📱","You mustn't use phones.","cấm"],["🧹","I have to clean my room.","phải (do hoàn cảnh)"],["🛌","You don't have to get up early.","không cần"]]},
ex:[
"[[must/Aux]] – <b>phải</b>: nghĩa vụ mạnh, thường do <b>người nói</b> thấy cần thiết, hoặc nội quy: You must listen to your teacher. I must study harder.",
"[[mustn't/Aux]] – <b>không được phép, cấm</b>: You mustn't run near the pool. You mustn't talk in the test.",
"[[have_to/Aux]] / has to – <b>phải</b> do <b>hoàn cảnh bên ngoài</b> (luật lệ, lịch trình, người khác yêu cầu): I have to wear a uniform at school. She has to take the bus.",
"[[don't_have_to/Aux]] / doesn't have to – <b>không cần, không bắt buộc</b> (muốn thì làm, không thì thôi): Tomorrow is Sunday. I don't have to get up early.",
"⚠️ <b>mustn't ≠ don't have to</b>: “You mustn't eat it” = cấm ăn. “You don't have to eat it” = không ăn cũng được.",
"Sau must / have to là <b>động từ nguyên mẫu</b>. must không đổi theo chủ ngữ; have to đổi thành <b>has to</b> với he/she/it, quá khứ là <b>had to</b>."],
f:[["Bắt buộc","S:Chủ ngữ + Aux:must / have to / has to + V:V nguyên mẫu"],["Cấm","S:Chủ ngữ + Aux:mustn't + V:V nguyên mẫu"],["Không cần","S:Chủ ngữ + Aux:don't / doesn't have to + V:V nguyên mẫu"]],
eg:[
["You/Pr.S must/Aux wear/V a/D helmet/N.O on/P a/D motorbike/N.","Bạn phải đội mũ bảo hiểm khi đi xe máy."],
["Students/N.S mustn't/Aux use/V phones/N.O in/P class/N.","Học sinh không được dùng điện thoại trong lớp."],
["My/D mum/N.S has_to/Aux work/V on/P Saturdays/N.","Mẹ tôi phải làm việc vào thứ Bảy."],
["We/Pr.S don't_have_to/Aux wear/V a/D uniform/N.O today/Adv.","Hôm nay chúng tôi không cần mặc đồng phục."],
["You/Pr.S mustn't/Aux swim/V here/Adv. It's/V dangerous/A.","Không được bơi ở đây. Nguy hiểm."],
["Do/Aux you/Pr.S have_to/Aux tidy/V your/D room/N.O?","Bạn có phải dọn phòng không?"],
["Yesterday/Adv I/Pr.S had_to/Aux go/V to/P the/D dentist/N.","Hôm qua tôi phải đi nha sĩ."]],
note:["<b>Lỗi thường gặp:</b> ❌ She musts go. → ✅ She <b>must</b> go. ❌ You must to listen. → ✅ You must <b>listen</b>. ❌ He have to go. → ✅ He <b>has</b> to go."],
q:[
{t:"mc",q:"You ___ cross the road when the light is red.",o:["must","mustn't","don't have to"],a:1,e:"Đèn đỏ → cấm qua đường → <b>mustn't</b>."},
{t:"mc",q:"It's a holiday. We ___ go to school.",o:["mustn't","don't have to","must"],a:1,e:"Ngày nghỉ → không cần đi học → <b>don't have to</b>."},
{t:"mc",q:"My sister ___ wear glasses to read.",o:["have to","has to","must to"],a:1,e:"My sister = she → <b>has to</b>."},
{t:"mc",q:"You ___ brush your teeth twice a day.",o:["must","mustn't"],a:0,e:"Việc cần làm → <b>must</b>."},
{t:"f",q:"Last night I ___ to finish my project. (quá khứ của have to)",a:["had"],e:"Quá khứ: <b>had to</b>."},
{t:"mc",q:"“You don't have to come” nghĩa là:",o:["Bạn bị cấm đến","Bạn không cần đến","Bạn phải đến"],a:1,e:"don't have to = <b>không cần</b>."},
{t:"o",a:"You mustn't feed the animals.",e:"You + mustn't + V + túc từ."}]},

{id:"i9",lv:2,t:"Future: will & going to",vi:"Thì tương lai: will và be going to",
pic:[{type:"time",m:"future",cap:"will: quyết định ngay lúc nói, dự đoán · going to: kế hoạch đã có, dấu hiệu rõ ràng"},{type:"grid",items:[["☁️🌧️","It's going to rain.","thấy mây đen"],["📞","I'll call you later.","quyết định ngay"],["🎂","We're going to have a party.","kế hoạch"]]}],
ex:[
"<b>will + V nguyên mẫu</b> (viết tắt 'll; phủ định <b>won't</b>) dùng để: <b>quyết định ngay lúc nói</b> (The phone is ringing. – I'll answer it!), <b>dự đoán</b> theo ý kiến (I think it will be sunny tomorrow), <b>hứa hẹn, đề nghị</b> (I'll help you).",
"<b>be going to + V nguyên mẫu</b> dùng để nói về <b>kế hoạch, dự định đã có từ trước</b> (I'm going to visit my aunt next week) và <b>dự đoán có dấu hiệu rõ ràng</b> (Look at those black clouds! It's going to rain).",
"Ở đây [[will/Aux]] và [[am/Aux]]/[[is/Aux]]/[[are/Aux]] + going to là phần <b>trợ động từ</b>; động từ chính là V nguyên mẫu phía sau.",
"<b>Câu hỏi:</b> Will you…? – Yes, I will. / No, I won't. · Are you going to…? – Yes, I am.",
"<b>Dấu hiệu:</b> tomorrow, next week/month/year, soon, in 2030, tonight, I think…, probably."],
f:[["will","S:Chủ ngữ + Aux:will / won't + V:V nguyên mẫu + O:…"],["going to","S:Chủ ngữ + Aux:am / is / are + X:going to + V:V nguyên mẫu"]],
eg:[
["I/Pr.S will/Aux help/V you/Pr.O with/P your/D bag/N.","Tớ sẽ giúp cậu xách túi."],
["I/Pr.S think/V robots/N.S will/Aux do/V our/D housework/N.O.","Tôi nghĩ người máy sẽ làm việc nhà cho chúng ta."],
["She/Pr.S won't/Aux be/V late/A.","Cô ấy sẽ không đến muộn."],
["We/Pr.S are/Aux going_to/Aux visit/V Ha_Long_Bay/N.O next_summer/Adv.","Hè tới chúng tôi sẽ đi thăm vịnh Hạ Long."],
["Look/V! The/D boy/N.S is/Aux going_to/Aux fall/V!","Nhìn kìa! Cậu bé sắp ngã!"],
["What/Q are/Aux you/Pr.S going_to/Aux do/V tomorrow/Adv?","Ngày mai bạn định làm gì?"]],
note:["<b>Lỗi thường gặp:</b> ❌ I will to go. → ✅ I will <b>go</b>. ❌ She wills come. → ✅ She <b>will</b> come. ❌ I going to swim. → ✅ I <b>am</b> going to swim."],
q:[
{t:"mc",q:"I'm thirsty. – Wait, I ___ get you some water.",o:["will","am going to"],a:0,e:"Quyết định ngay lúc nói → <b>will</b>."},
{t:"mc",q:"I've bought the tickets. We ___ see a film tonight.",o:["will","are going to"],a:1,e:"Kế hoạch đã có → <b>are going to</b>."},
{t:"mc",q:"Look at the sky! It ___ snow.",o:["will","is going to"],a:1,e:"Có dấu hiệu rõ ràng → <b>is going to</b>."},
{t:"f",q:"Don't worry. I ___ tell anyone. (sẽ không, viết tắt)",a:["won't","will not"],e:"will not = <b>won't</b>."},
{t:"mc",q:"She will ___ ten next month.",o:["be","is","being"],a:0,e:"Sau will → nguyên mẫu <b>be</b>."},
{t:"f",q:"My dad ___ going to buy a new car. (to be)",a:["is"],e:"My dad = he → <b>is</b> going to."},
{t:"o",a:"Will you come to my party?",e:"Will + you + V + túc từ?"}]},

{id:"i10",lv:2,t:"Conjunctions",vi:"Liên từ: and, but, or, because, so",
pic:{type:"grid",items:[["➕","and","và (thêm ý)"],["↔️","but","nhưng (trái ý)"],["❔","or","hoặc (lựa chọn)"],["⬅️","because","vì (nguyên nhân)"],["➡️","so","nên (kết quả)"]]},
ex:[
"<b>Liên từ</b> (conjunction) dùng để <b>nối</b> hai từ, hai cụm từ hoặc hai câu lại với nhau.",
"[[and/C]] – <b>và</b>: nối hai ý giống nhau: I like cats <b>and</b> dogs.",
"[[but/C]] – <b>nhưng</b>: nối hai ý trái ngược: The bag is nice <b>but</b> expensive.",
"[[or/C]] – <b>hoặc, hay</b>: đưa ra lựa chọn: Do you want tea <b>or</b> milk? (Trong câu phủ định dùng or thay and: I don't like tea <b>or</b> coffee.)",
"[[because/C]] – <b>vì, bởi vì</b>: đứng trước <b>nguyên nhân</b>: I stayed at home <b>because</b> I was ill.",
"[[so/C]] – <b>vì vậy, nên</b>: đứng trước <b>kết quả</b>: I was ill, <b>so</b> I stayed at home. (because và so đảo vị trí nguyên nhân/kết quả cho nhau!)",
"Thêm: [[when/C]] (khi), [[before/C]] (trước khi), [[after/C]] (sau khi), [[although/C]] (mặc dù)."],
f:[["Nối hai câu","S:Câu 1 + C:and / but / or / so + S:Câu 2"],["Nguyên nhân","S:Kết quả + C:because + S:Nguyên nhân"],["Kết quả","S:Nguyên nhân + C:, so + S:Kết quả"]],
eg:[
["I/Pr.S have/V a/D brother/N.O and/C a/D sister/N.O.","Tôi có một anh trai và một chị gái."],
["The/D box/N.S is/V big/A but/C light/A.","Cái hộp to nhưng nhẹ."],
["Would/Aux you/Pr.S like/V juice/N.O or/C water/N.O?","Bạn muốn nước ép hay nước lọc?"],
["She/Pr.S is/V happy/A because/C she/Pr.S won/V the/D race/N.O.","Cô ấy vui vì đã thắng cuộc đua."],
["It/Pr.S was/V raining/V, so/C we/Pr.S played/V inside/Adv.","Trời mưa nên chúng tôi chơi trong nhà."],
["When/C I/Pr.S got/V home/Adv, I/Pr.S had/V a/D shower/N.O.","Khi về nhà, tôi tắm."],
["Although/C it/Pr.S was/V cold/A, he/Pr.S went/V swimming/V.","Mặc dù trời lạnh, anh ấy vẫn đi bơi."]],
note:["<b>Lỗi thường gặp:</b> ❌ Because I was tired, so I went to bed. → chỉ dùng <b>một</b> trong hai: ✅ Because I was tired, I went to bed. / ✅ I was tired, so I went to bed.","❌ Although it rained, but we went out. → ✅ Although it rained, we went out."],
q:[
{t:"mc",q:"I like apples ___ bananas.",o:["and","but","so"],a:0,e:"Hai ý giống nhau → <b>and</b>."},
{t:"mc",q:"He is rich ___ he isn't happy.",o:["and","but","or"],a:1,e:"Ý trái ngược → <b>but</b>."},
{t:"mc",q:"Is your cat black ___ white?",o:["and","or","so"],a:1,e:"Lựa chọn → <b>or</b>."},
{t:"mc",q:"I'm hungry, ___ I'm going to make a sandwich.",o:["because","so","but"],a:1,e:"Đứng trước kết quả → <b>so</b>."},
{t:"mc",q:"I'm wearing a coat ___ it's cold.",o:["because","so","or"],a:0,e:"Đứng trước nguyên nhân → <b>because</b>."},
{t:"f",q:"We couldn't play outside ___ it was raining.",a:["because"],e:"it was raining là nguyên nhân → <b>because</b>."},
{t:"o",a:"She was tired, so she went to bed early.",e:"Nguyên nhân + so + kết quả."}]},

["You/Pr.S shouldn't/Aux eat/V so/Adv much/D chocolate/N.O.","Bạn không nên ăn nhiều sô-cô-la như thế."],
["Children/N.S should/Aux drink/V lots_of/D water/N.O.","Trẻ em nên uống nhiều nước."],
["We/Pr.S shouldn't/Aux throw/V rubbish/N.O in/P the/D river/N.","Chúng ta không nên vứt rác xuống sông."],
["What/Q should/Aux I/Pr.S buy/V for/P Mum's/N birthday/N?","Mình nên mua gì cho sinh nhật mẹ?"]],
note:["<b>Lỗi thường gặp:</b> ❌ You should to rest. → ✅ You should <b>rest</b>. ❌ He shoulds go. → ✅ He <b>should</b> go."],
q:[

{t:"mc",q:"You ___ play computer games all day.",o:["should","shouldn't"],a:1,e:"Không tốt → <b>shouldn't</b>."},

{id:"i12",lv:2,t:"Present Perfect",vi:"Thì hiện tại hoàn thành",
pic:{type:"time",m:"pastToNow",cap:"Hành động bắt đầu trong quá khứ, còn liên quan / kéo dài đến hiện tại"},
ex:[
"<b>Thì hiện tại hoàn thành</b> nối <b>quá khứ với hiện tại</b>. Dùng khi: (1) nói về <b>trải nghiệm</b> (đã từng/chưa từng), không nói rõ khi nào: I have been to Hanoi. (2) hành động <b>vừa mới xảy ra</b> hoặc có kết quả ở hiện tại: I have lost my key (bây giờ không có chìa). (3) hành động kéo dài từ quá khứ <b>đến bây giờ</b>: She has lived here for five years.",
"<b>Cấu trúc:</b> have / has + <b>V3</b> (quá khứ phân từ). [[have/Aux]] / [[has/Aux]] là trợ động từ. Động từ có quy tắc: V3 = V-ed (play → played). Bất quy tắc: go → gone/been, eat → eaten, see → seen, do → done, write → written, take → taken, break → broken, buy → bought, make → made.",
"<b>Từ đi kèm:</b> <b>ever</b> (đã từng – câu hỏi), <b>never</b> (chưa bao giờ), <b>already</b> (rồi), <b>yet</b> (chưa – cuối câu phủ định/câu hỏi), <b>just</b> (vừa mới), <b>for</b> + khoảng thời gian (for two years), <b>since</b> + mốc thời gian (since 2020, since Monday).",
"<b>Phủ định:</b> haven't / hasn't + V3. <b>Câu hỏi:</b> Have / Has + S + V3? <i>Have you ever eaten snails? – Yes, I have.</i>",
"<b>Khác quá khứ đơn:</b> quá khứ đơn có <b>thời gian cụ thể</b> (I went to Hue <b>last year</b>), hiện tại hoàn thành <b>không</b> nói thời gian cụ thể (I <b>have been</b> to Hue)."],
f:[["Khẳng định","S:Chủ ngữ + Aux:have / has + V:V3 + O:…"],["Phủ định","S:Chủ ngữ + Aux:haven't / hasn't + V:V3"],["Câu hỏi","Aux:Have / Has + S:Chủ ngữ + Adv:(ever) + V:V3 + X:?"]],
eg:[
["I/Pr.S have/Aux visited/V Hanoi/N.O twice/Adv.","Tôi đã đến Hà Nội hai lần."],
["She/Pr.S has/Aux just/Adv finished/V her/D homework/N.O.","Cô ấy vừa làm xong bài tập."],
["We/Pr.S have/Aux lived/V here/Adv for/P six/D years/N.","Chúng tôi đã sống ở đây sáu năm."],
["He/Pr.S hasn't/Aux eaten/V lunch/N.O yet/Adv.","Cậu ấy vẫn chưa ăn trưa."],
["Have/Aux you/Pr.S ever/Adv seen/V a/D dolphin/N.O?","Bạn đã bao giờ nhìn thấy cá heo chưa?"],
["My/D dad/N.S has/Aux worked/V there/Adv since/P 2015/N.","Bố tôi làm ở đó từ năm 2015."],
["Oh_no/Adv! I've/Aux broken/V the/D window/N.O!","Ôi không! Mình làm vỡ cửa kính rồi!"]],
note:["<b>for</b> + khoảng thời gian (for 3 days, for a long time) ↔ <b>since</b> + mốc thời gian (since Monday, since I was six).","<b>been</b> vs <b>gone</b>: She has <b>been</b> to Paris (đã đi và về rồi). She has <b>gone</b> to Paris (đã đi, giờ vẫn đang ở đó)."],
q:[
{t:"f",q:"I have ___ (see) that film three times.",a:["seen"],e:"see → V3 <b>seen</b>."},
{t:"mc",q:"She ___ already done her homework.",o:["have","has","is"],a:1,e:"She → <b>has</b>."},
{t:"mc",q:"Have you ___ been to Da Lat?",o:["ever","yet","since"],a:0,e:"Câu hỏi về trải nghiệm → <b>ever</b>."},
{t:"mc",q:"We have known each other ___ 2019.",o:["for","since"],a:1,e:"2019 là mốc thời gian → <b>since</b>."},
{t:"mc",q:"They have been friends ___ five years.",o:["for","since"],a:0,e:"five years là khoảng thời gian → <b>for</b>."},
{t:"mc",q:"I ___ to the zoo last Sunday.",o:["have gone","went","have been"],a:1,e:"last Sunday là thời gian cụ thể → quá khứ đơn <b>went</b>."},
{t:"f",q:"He hasn't finished his lunch ___ . (chưa – cuối câu)",a:["yet"],e:"<b>yet</b> đứng cuối câu phủ định."},
{t:"f",q:"Oh no! I have ___ (lose) my pencil case.",a:["lost"],e:"lose → <b>lost</b>."}]},

{id:"i13",lv:2,t:"Objects: direct & indirect",vi:"Túc từ trực tiếp và túc từ gián tiếp",
pic:{type:"svo",s:["👩","Mum"],v:"gives",oi:["👦","me"],o:["🎁","a present"],cap:"Mẹ (chủ ngữ) → tặng (động từ) → tôi (túc từ gián tiếp) → một món quà (túc từ trực tiếp)"},
ex:[
"Bài này giúp em hiểu <b>túc từ</b> (object) thật kỹ. Túc từ là phần <b>nhận tác động</b> của động từ và thường đứng <b>ngay sau động từ</b>. Muốn tìm túc từ, hãy hỏi: <b>Động từ + “cái gì?” / “ai?”</b>",
"<b>Động từ có túc từ</b> (ngoại động từ – transitive): eat, buy, like, see, kick, read… → [[He/Pr.S]] [[kicked/V]] [[the_ball/N.O]]. (Đá cái gì? → the ball). <b>Động từ không cần túc từ</b> (nội động từ – intransitive): sleep, arrive, cry, laugh, go… → [[The_baby/N.S]] [[is/Aux]] [[sleeping/V]]. (không có túc từ).",
"<b>Túc từ trực tiếp</b> (direct object) là <b>vật</b> chịu tác động: She gave me <b>a book</b>. <b>Túc từ gián tiếp</b> (indirect object) là <b>người nhận</b> vật đó: She gave <b>me</b> a book.",
"Có <b>hai cách</b> sắp xếp với các động từ give, send, show, buy, make, tell, bring, lend, teach, pass: <br>① S + V + <b>người</b> + <b>vật</b>: [[Dad/N.S]] [[bought/V]] [[me/Pr.Oi]] [[a_kite/N.O]]. <br>② S + V + <b>vật</b> + <b>to/for</b> + <b>người</b>: [[Dad/N.S]] [[bought/V]] [[a_kite/N.O]] [[for/P]] [[me/Pr.O]].",
"Dùng <b>to</b> với: give, send, show, tell, lend, pass, teach, write. Dùng <b>for</b> với: buy, make, cook, get, find.",
"<b>Túc từ có thể là:</b> danh từ (a book), đại từ túc từ (me, him, them), danh động từ (I like <b>swimming</b>), hoặc cả một mệnh đề (I know <b>that you are right</b>)."],
f:[["1 túc từ","S:Chủ ngữ + V:Động từ + O:Túc từ"],["2 túc từ (cách 1)","S:Chủ ngữ + V:give / buy… + O:Người (gián tiếp) + O:Vật (trực tiếp)"],["2 túc từ (cách 2)","S:Chủ ngữ + V:give / buy… + O:Vật + P:to / for + O:Người"]],
eg:[
["My/D grandma/N.S tells/V me/Pr.Oi a/D story/N.O every_night/Adv.","Bà kể cho tôi một câu chuyện mỗi tối."],
["The/D teacher/N.S showed/V us/Pr.Oi some/D photos/N.O.","Cô giáo cho chúng tôi xem vài bức ảnh."],
["Can/Aux you/Pr.S pass/V me/Pr.Oi the/D salt/N.O, please/Adv?","Bạn đưa giúp tôi lọ muối được không?"],
["Mum/N.S made/V a/D cake/N.O for/P my/D birthday/N.","Mẹ đã làm bánh cho sinh nhật tôi."],
["He/Pr.S sent/V a/D postcard/N.O to/P his/D cousin/N.O.","Cậu ấy gửi một tấm bưu thiếp cho anh họ."],
["The/D children/N.S laughed/V.","Bọn trẻ cười. (không có túc từ)"],
["I/Pr.S lent/V Tom/N.Oi my/D bike/N.O.","Tôi cho Tom mượn xe đạp."]],
note:["Khi túc từ trực tiếp là <b>đại từ</b> (it, them), dùng cách ②: ✅ Give <b>it</b> to me. ❌ Give me it.","Câu bị động có thể bắt đầu bằng túc từ gián tiếp: <i>I was given a present</i> (Tôi được tặng một món quà)."],
q:[
{t:"mc",q:"Trong câu “She wrote a letter.”, túc từ là:",o:["She","wrote","a letter"],a:2,e:"Viết cái gì? → <b>a letter</b>."},
{t:"mc",q:"Trong câu “Dad gave me some money.”, túc từ <b>gián tiếp</b> là:",o:["Dad","me","some money"],a:1,e:"Người nhận → <b>me</b> (túc từ gián tiếp); some money là túc từ trực tiếp."},
{t:"mc",q:"Câu nào <b>không có</b> túc từ?",o:["The baby cried.","I ate a pear.","We saw a film."],a:0,e:"cry là nội động từ, không cần túc từ."},
{t:"mc",q:"Grandpa bought a bike ___ me.",o:["to","for","at"],a:1,e:"buy đi với <b>for</b>."},
{t:"mc",q:"Please give this book ___ Linh.",o:["to","for","with"],a:0,e:"give đi với <b>to</b>."},
{t:"o",a:"My uncle sent me a postcard.",e:"S + V + người (me) + vật (a postcard)."},
{t:"o",a:"Can you show the photo to your friends?",e:"Cách 2: V + vật + to + người."},
{t:"mc",q:"Câu nào <b>đúng</b>?",o:["Give me it.","Give it to me.","Give to me it."],a:1,e:"Túc từ trực tiếp là đại từ it → dùng cách 2: <b>Give it to me</b>."}]},

{id:"a1",lv:3,t:"Past Continuous",vi:"Thì quá khứ tiếp diễn (when / while)",
pic:{type:"time",m:"pastInterrupt",cap:"Hành động dài đang diễn ra trong quá khứ (sóng) thì một hành động ngắn xen vào (tia chớp)"},
ex:[
"<b>Thì quá khứ tiếp diễn</b> diễn tả hành động <b>đang xảy ra tại một thời điểm</b> trong quá khứ: At 8 p.m. yesterday, I <b>was watching</b> TV.",
"<b>Cấu trúc:</b> was / were + <b>V-ing</b>. I/he/she/it → [[was/Aux]]; you/we/they → [[were/Aux]].",
"<b>Hành động bị xen ngang:</b> hành động <b>dài</b> dùng quá khứ tiếp diễn, hành động <b>ngắn</b> xen vào dùng quá khứ đơn, nối bằng <b>when</b>: I <b>was having</b> a bath <b>when</b> the phone <b>rang</b>.",
"<b>Hai hành động song song:</b> dùng <b>while</b> (trong khi) + quá khứ tiếp diễn: <b>While</b> Mum <b>was cooking</b>, Dad <b>was reading</b>.",
"<b>Mẹo:</b> <b>while</b> + hành động dài (V-ing); <b>when</b> + hành động ngắn (V2).",
"<b>Phủ định:</b> wasn't / weren't + V-ing. <b>Câu hỏi:</b> Was / Were + S + V-ing? <i>What were you doing at 9 last night?</i>"],
f:[["Khẳng định","S:Chủ ngữ + Aux:was / were + V:V-ing + O:…"],["Bị xen ngang","S:QK tiếp diễn + C:when + S:QK đơn"],["Song song","C:While + S:QK tiếp diễn + X:, + S:QK tiếp diễn"]],
eg:[
["At/P seven_o'clock/N, I/Pr.S was/Aux having/V dinner/N.O.","Lúc 7 giờ tôi đang ăn tối."],
["They/Pr.S were/Aux playing/V football/N.O when/C it/Pr.S started/V to_rain/V.","Họ đang đá bóng thì trời bắt đầu mưa."],
["While/C I/Pr.S was/Aux walking/V home/Adv, I/Pr.S saw/V a/D rainbow/N.O.","Trong lúc đi bộ về nhà, tôi thấy cầu vồng."],
["She/Pr.S fell/V off/P her/D bike/N when/C she/Pr.S was/Aux riding/V to/P school/N.","Cô ấy ngã xe khi đang đạp đến trường."],
["What/Q were/Aux you/Pr.S doing/V at/P 10_p.m./N?","Lúc 10 giờ tối bạn đang làm gì?"],
["The/D baby/N.S wasn't/Aux sleeping/V.","Em bé đã không ngủ."]],
note:["<b>Lỗi thường gặp:</b> ❌ When I was walking, I was seeing a rainbow → hành động ngắn dùng quá khứ đơn: ✅ I <b>saw</b> a rainbow."],
q:[
{t:"f",q:"At 9 p.m. last night, I ___ (watch) a film.",a:["was watching"],e:"Đang xảy ra tại thời điểm quá khứ → <b>was watching</b>."},
{t:"mc",q:"We ___ dinner when the lights went out.",o:["had","were having","are having"],a:1,e:"Hành động dài bị xen ngang → <b>were having</b>."},
{t:"mc",q:"I was reading when my friend ___ .",o:["was calling","called","calls"],a:1,e:"Hành động ngắn xen vào → <b>called</b>."},
{t:"mc",q:"___ she was cooking, he was cleaning the house.",o:["When","While","So"],a:1,e:"Hai hành động dài song song → <b>While</b>."},
{t:"f",q:"What ___ you doing at 6 o'clock yesterday?",a:["were"],e:"you → <b>were</b>."},
{t:"o",a:"It was snowing when we arrived.",e:"QK tiếp diễn + when + QK đơn."}]},

{id:"a2",lv:3,t:"Conditionals 0 & 1",vi:"Câu điều kiện loại 0 và loại 1",
pic:{type:"grid",items:[["🧊🔥➡️💧","If you heat ice, it melts.","loại 0 – sự thật"],["🌧️☂️","If it rains, I will take an umbrella.","loại 1 – có thể xảy ra"],["📚✅","If you study hard, you will pass.","loại 1"]]},
ex:[
"<b>Câu điều kiện</b> gồm hai mệnh đề: <b>mệnh đề If</b> (điều kiện – “nếu”) và <b>mệnh đề chính</b> (kết quả). Hai mệnh đề có thể đổi chỗ; khi If đứng đầu thì có <b>dấu phẩy</b> ở giữa.",
"<b>Loại 0 – sự thật hiển nhiên, quy luật:</b> If + hiện tại đơn, hiện tại đơn. <i>If you mix red and yellow, you get orange. If water reaches 100°C, it boils.</i> (If ở đây gần nghĩa với when.)",
"<b>Loại 1 – điều có thể xảy ra ở hiện tại/tương lai:</b> If + <b>hiện tại đơn</b>, <b>will</b> + V nguyên mẫu. <i>If it is sunny tomorrow, we will go to the beach.</i>",
"⚠️ Mệnh đề If loại 1 <b>không dùng will</b>: ❌ If it will rain… → ✅ If it <b>rains</b>…",
"Mệnh đề chính có thể dùng can, may, must, should hoặc câu mệnh lệnh: <i>If you are tired, you should rest. If you see Tom, tell him to call me.</i>",
"<b>unless</b> = if… not (trừ khi): <i>Unless you hurry, you will miss the bus</i> = If you don't hurry, …"],
f:[["Loại 0","C:If + S:S + V(hiện tại đơn) + X:, + S:S + V(hiện tại đơn)"],["Loại 1","C:If + S:S + V(hiện tại đơn) + X:, + S:S + Aux:will + V:V nguyên mẫu"]],
eg:[
["If/C you/Pr.S heat/V ice/N.O, it/Pr.S melts/V.","Nếu bạn làm nóng đá, nó tan chảy."],
["If/C plants/N.S don't/Aux get/V water/N.O, they/Pr.S die/V.","Nếu cây không có nước, chúng chết."],
["If/C it/Pr.S rains/V tomorrow/Adv, we/Pr.S will/Aux stay/V at/P home/N.","Nếu mai trời mưa, chúng tôi sẽ ở nhà."],
["You/Pr.S will/Aux get/V wet/A if/C you/Pr.S don't/Aux take/V an/D umbrella/N.O.","Bạn sẽ bị ướt nếu không mang ô."],
["If/C you/Pr.S study/V hard/Adv, you/Pr.S will/Aux pass/V the/D exam/N.O.","Nếu bạn học chăm, bạn sẽ đỗ."],
["If/C you/Pr.S are/V hungry/A, eat/V a/D banana/N.O.","Nếu bạn đói, hãy ăn một quả chuối."],
["Unless/C we/Pr.S hurry/V, we/Pr.S will/Aux miss/V the/D train/N.O.","Nếu không nhanh lên, chúng ta sẽ lỡ tàu."]],
note:["<b>Lỗi thường gặp:</b> ❌ If I will see him, I will tell him. → ✅ If I <b>see</b> him, I will tell him.","Khi mệnh đề chính đứng trước, <b>không</b> cần dấu phẩy: <i>I will tell him if I see him.</i>"],
q:[
{t:"mc",q:"If you ___ ice in the sun, it melts.",o:["put","will put","putting"],a:0,e:"Loại 0: hiện tại đơn ở cả hai vế → <b>put</b>."},
{t:"mc",q:"If it ___ sunny, we will have a picnic.",o:["will be","is","was"],a:1,e:"Mệnh đề If loại 1 dùng hiện tại đơn → <b>is</b>."},
{t:"f",q:"If you eat too much, you ___ (feel) sick. (loại 1)",a:["will feel","'ll feel"],e:"Mệnh đề chính → <b>will feel</b>."},
{t:"mc",q:"I'll call you if I ___ time.",o:["have","will have","had"],a:0,e:"Mệnh đề If → <b>have</b>."},
{t:"mc",q:"___ you water the flowers, they will die.",o:["If","Unless","When"],a:1,e:"Nếu bạn không tưới → <b>Unless</b>."},
{t:"f",q:"If she ___ (not hurry), she will be late.",a:["doesn't hurry","does not hurry"],e:"she → <b>doesn't hurry</b>."},
{t:"o",a:"If you mix blue and yellow, you get green.",e:"Câu điều kiện loại 0 – sự thật."}]},

{id:"a3",lv:3,t:"Conditionals 2 & 3",vi:"Câu điều kiện loại 2 và loại 3",
pic:{type:"grid",items:[["💰🏝️","If I had a lot of money, I would travel.","loại 2 – không có thật ở hiện tại"],["🦅","If I were a bird, I would fly.","loại 2"],["⏰🚌","If I had got up early, I wouldn't have missed the bus.","loại 3 – không có thật trong quá khứ"]]},
ex:[
"<b>Loại 2 – tưởng tượng, không có thật ở hiện tại:</b> If + <b>quá khứ đơn</b>, <b>would</b> + V nguyên mẫu. <i>If I had wings, I would fly to the moon.</i> (Thực tế: tôi không có cánh.)",
"Với to be trong loại 2, dùng <b>were</b> cho <b>mọi</b> chủ ngữ (văn chuẩn): <i>If I <b>were</b> you, I would say sorry.</i> (Lời khuyên: Nếu tôi là bạn…)",
"Dù dùng động từ quá khứ, loại 2 <b>nói về hiện tại/tương lai</b>, không phải quá khứ!",
"<b>Loại 3 – tưởng tượng, không có thật trong quá khứ</b> (tiếc nuối): If + <b>had + V3</b>, <b>would have + V3</b>. <i>If I had studied harder, I would have passed the test.</i> (Thực tế: tôi đã không học chăm và đã trượt.)",
"<b>Bảng tóm tắt:</b> Loại 1 – có thể xảy ra (will). Loại 2 – không thật ở hiện tại (would + V). Loại 3 – không thật ở quá khứ (would have + V3)."],
f:[["Loại 2","C:If + S:S + V:V2 / were + X:, + S:S + Aux:would + V:V nguyên mẫu"],["Loại 3","C:If + S:S + Aux:had + V:V3 + X:, + S:S + Aux:would have + V:V3"]],
eg:[

["If/C she/Pr.S lived/V near/P the/D sea/N, she/Pr.S would/Aux swim/V every_day/Adv.","Nếu cô ấy sống gần biển, cô ấy sẽ bơi mỗi ngày."],

{id:"a4",lv:3,t:"Passive Voice",vi:"Câu bị động",
pic:[{type:"svo",s:["👦","Tom"],v:"eats",o:["🍰","the cake"],cap:"Chủ động: Tom (chủ ngữ) ăn cái bánh (túc từ)"},{type:"svo",s:["🍰","The cake"],v:"is eaten",o:["👦","by Tom"],nr:1,cap:"Bị động: túc từ “the cake” lên làm chủ ngữ; người làm đi sau “by”"}],
ex:[
"<b>Câu chủ động</b>: chủ ngữ <b>làm</b> hành động (Tom eats the cake). <b>Câu bị động</b>: chủ ngữ <b>chịu</b> hành động (The cake is eaten by Tom). Dùng bị động khi muốn nhấn mạnh vào <b>vật/người chịu tác động</b>, hoặc khi không biết/không cần nói ai làm.",
"<b>Cách đổi:</b> ① Lấy <b>túc từ</b> của câu chủ động làm <b>chủ ngữ</b> mới. ② Động từ đổi thành <b>be + V3</b> (be chia theo thì của câu gốc và theo chủ ngữ mới). ③ Chủ ngữ cũ đưa ra sau <b>by</b> (có thể bỏ nếu không quan trọng: by people, by someone).",
"Đây là lý do <b>chỉ động từ có túc từ</b> mới đổi sang bị động được. ❌ The baby is slept (sleep không có túc từ).",
"<b>Bị động theo thì:</b> Hiện tại đơn: am/is/are + V3 (English <b>is spoken</b> here). Quá khứ đơn: was/were + V3 (The window <b>was broken</b>). Hiện tại tiếp diễn: am/is/are <b>being</b> + V3. Hiện tại hoàn thành: have/has <b>been</b> + V3. Tương lai: will <b>be</b> + V3. Động từ khuyết thiếu: can/must/should <b>be</b> + V3.",
"Đại từ sau by dùng dạng <b>túc từ</b>: by <b>me</b>, by <b>him</b>, by <b>them</b>."],
f:[["Chủ động","S:Chủ ngữ + V:Động từ + O:Túc từ"],["Bị động","S:Túc từ cũ + Aux:be + V:V3 + P:by + O:Chủ ngữ cũ"]],
eg:[
["The/D window/N.S was/Aux broken/V by/P the/D boys/N.O.","Cửa sổ bị mấy cậu bé làm vỡ."],
["English/N.S is/Aux spoken/V all_over_the_world/Adv.","Tiếng Anh được nói trên khắp thế giới."],
["This/D house/N.S was/Aux built/V in/P 1990/N.","Ngôi nhà này được xây năm 1990."],
["The/D room/N.S is/Aux cleaned/V every_day/Adv.","Căn phòng được dọn mỗi ngày."],
["Our/D homework/N.S will/Aux be/Aux checked/V tomorrow/Adv.","Bài tập của chúng tôi sẽ được kiểm tra vào ngày mai."],
["The/D cake/N.S has/Aux been/Aux eaten/V!","Cái bánh đã bị ăn mất rồi!"],
["Rubbish/N.S must/Aux be/Aux put/V in/P the/D bin/N.","Rác phải được bỏ vào thùng."]],
note:["<b>Lỗi thường gặp:</b> ❌ The cake is eat by Tom → ✅ The cake is <b>eaten</b> (phải dùng V3). ❌ The letters was written → ✅ The letters <b>were</b> written (be chia theo chủ ngữ mới)."],
q:[
{t:"mc",q:"Chủ động: “Lan cleans the room.” → Bị động:",o:["The room cleans by Lan.","The room is cleaned by Lan.","The room was cleaned by Lan."],a:1,e:"Hiện tại đơn → is + V3: <b>is cleaned</b>."},
{t:"mc",q:"Chủ động: “Someone stole my bike.” → Bị động:",o:["My bike was stolen.","My bike is stolen.","My bike stole."],a:0,e:"Quá khứ đơn → was + V3: <b>was stolen</b>."},
{t:"f",q:"Rice ___ (grow) in Vietnam. (bị động, hiện tại đơn)",a:["is grown"],e:"<b>is grown</b>."},
{t:"f",q:"These photos ___ (take) by my dad last year.",a:["were taken"],e:"Số nhiều + quá khứ → <b>were taken</b>."},
{t:"mc",q:"The letter will ___ tomorrow.",o:["send","be sent","sent"],a:1,e:"Tương lai bị động: will <b>be sent</b>."},
{t:"mc",q:"Câu nào <b>không thể</b> đổi sang bị động?",o:["She wrote a poem.","The bird flew away.","They built a bridge."],a:1,e:"fly away không có túc từ → không đổi sang bị động được."},
{t:"o",a:"The book was written by a famous author.",e:"Chủ ngữ mới + was + V3 + by + người làm."}]},

{id:"a5",lv:3,t:"Relative Clauses",vi:"Mệnh đề quan hệ: who, which, that, where, whose",
pic:{type:"grid",items:[["👩‍🏫","the woman who teaches me","who → người"],["🏠","the house which is red","which → vật"],["🏫","the school where I study","where → nơi chốn"],["👧🐶","the girl whose dog is lost","whose → của ai"]]},
ex:[
"<b>Mệnh đề quan hệ</b> (relative clause) đứng <b>ngay sau một danh từ</b> để cho biết thêm thông tin, giúp người nghe biết ta đang nói về <b>ai/cái gì</b>. Nó giống một “tính từ dài” bổ nghĩa cho danh từ.",
"[[who/Pr]] – thay cho <b>người</b>: The boy <b>who</b> lives next door is my friend.",
"[[which/Pr]] – thay cho <b>vật, con vật</b>: I like the T-shirt <b>which</b> you gave me.",
"[[that/Pr]] – thay cho cả người và vật (trong mệnh đề xác định): The book <b>that</b> I'm reading is great.",
"[[where/Adv]] – thay cho <b>nơi chốn</b>: This is the village <b>where</b> my mum was born. · [[whose/D]] – chỉ <b>sở hữu</b> (của người đó): That's the girl <b>whose</b> brother is a pilot. · <b>when</b> – thời gian: I remember the day <b>when</b> we met.",
"<b>Bỏ đại từ quan hệ:</b> khi who/which/that làm <b>túc từ</b> trong mệnh đề quan hệ, ta có thể bỏ nó đi: The cake (<b>which</b>) Mum made was delicious. (Mum made <b>the cake</b> → the cake là túc từ của made.) Nhưng khi nó làm <b>chủ ngữ</b> thì <b>không bỏ được</b>: The man <b>who</b> helped me… (who là chủ ngữ của helped)."],
f:[["Người","N:Danh từ chỉ người + Pr:who / that + V:Động từ…"],["Vật","N:Danh từ chỉ vật + Pr:which / that + X:…"],["Nơi chốn","N:Nơi chốn + Adv:where + S:S + V:V…"]],
eg:[
["The/D girl/N.S who/Pr is/V singing/V is/V my/D sister/N.","Cô bé đang hát là em gái tôi."],
["I/Pr.S have/V a/D parrot/N.O which/Pr can/Aux talk/V.","Tôi có một con vẹt biết nói."],
["This/Pr.S is/V the/D park/N where/Adv we/Pr.S play/V football/N.O.","Đây là công viên nơi chúng tôi chơi bóng."],
["The/D film/N.S that/Pr we/Pr.S watched/V was/V really/Adv funny/A.","Bộ phim chúng tôi đã xem thật sự rất vui."],
["A/D vet/N.S is/V a/D person/N who/Pr looks_after/V sick/A animals/N.O.","Bác sĩ thú y là người chăm sóc những con vật bị ốm."],
["That's/V the/D man/N whose/D car/N.S was/Aux stolen/V.","Đó là người đàn ông có chiếc xe bị trộm."]],
note:["<b>Lỗi thường gặp:</b> ❌ The man which… → ✅ The man <b>who</b>… ❌ The dog who… (thường dùng which/that cho con vật). ❌ The book which I read it → ✅ The book which I read (không lặp lại túc từ it)."],
q:[
{t:"mc",q:"A doctor is someone ___ helps sick people.",o:["who","which","where"],a:0,e:"Thay cho người → <b>who</b>."},
{t:"mc",q:"This is the bike ___ my dad bought me.",o:["who","which","where"],a:1,e:"Thay cho vật → <b>which</b>."},
{t:"mc",q:"That's the hospital ___ I was born.",o:["which","who","where"],a:2,e:"Nơi chốn → <b>where</b>."},
{t:"mc",q:"I know a boy ___ father is a pilot.",o:["who","whose","which"],a:1,e:"Sở hữu (bố của cậu bé) → <b>whose</b>."},
{t:"f",q:"A penguin is a bird ___ can't fly. (which / who)",a:["which","that"],e:"Con vật → <b>which</b> (hoặc that)."},
{t:"mc",q:"Ở câu nào có thể <b>bỏ</b> đại từ quan hệ?",o:["The boy who won the race is Tom.","The cake which I made is tasty."],a:1,e:"which là túc từ của made → bỏ được: The cake I made is tasty."},
{t:"o",a:"The woman who lives next door is a nurse.",e:"Danh từ + who + mệnh đề + động từ chính."}]},

{id:"a6",lv:3,t:"Reported Speech",vi:"Câu tường thuật (câu gián tiếp)",
pic:{type:"grid",items:[["💬","“I am tired.”","câu trực tiếp"],["🗣️","She said (that) she was tired.","câu tường thuật"],["💬","“I will come.”","trực tiếp"],["🗣️","He said he would come.","tường thuật"]]},
ex:[
"<b>Câu tường thuật</b> dùng để <b>kể lại</b> lời người khác nói, không dùng dấu ngoặc kép. Động từ tường thuật thường là <b>said</b> (said + that…) hoặc <b>told</b> + người (told me that…).",
"<b>Quy tắc lùi thì</b> (khi động từ tường thuật ở quá khứ): hiện tại đơn → quá khứ đơn; hiện tại tiếp diễn → quá khứ tiếp diễn; quá khứ đơn → quá khứ hoàn thành (had + V3); will → would; can → could; must → had to; am/is → was; are → were.",
"<b>Đổi đại từ</b> theo người nói: “<b>I</b> like <b>my</b> school,” said Tom. → Tom said (that) <b>he</b> liked <b>his</b> school.",
"<b>Đổi trạng từ thời gian/nơi chốn:</b> now → then; today → that day; tomorrow → the next day; yesterday → the day before; here → there; this → that.",
"<b>Câu hỏi tường thuật:</b> asked + (người) + if/whether (câu Yes/No) hoặc từ để hỏi, và câu trở lại <b>trật tự câu khẳng định</b>: “Are you hungry?” → She asked me <b>if I was</b> hungry. “Where do you live?” → He asked me <b>where I lived</b>.",
"<b>Mệnh lệnh tường thuật:</b> told + người + <b>(not) to + V</b>: “Sit down!” → The teacher told us <b>to sit</b> down. “Don't run!” → Mum told me <b>not to run</b>."],
f:[["Câu kể","S:Người nói + V:said (that) + S:S + V:V (lùi thì)"],["Câu hỏi","S:Người nói + V:asked + O:me + C:if / Wh- + S:S + V:V (lùi thì)"],["Mệnh lệnh","S:Người nói + V:told + O:me + X:(not) to + V:V nguyên mẫu"]],
eg:[
["She/Pr.S said/V that/C she/Pr.S was/V hungry/A.","Cô ấy nói rằng cô ấy đói."],
["Tom/N.S told/V me/Pr.O that/C he/Pr.S liked/V pizza/N.O.","Tom bảo tôi rằng cậu ấy thích pizza."],
["He/Pr.S said/V he/Pr.S would/Aux call/V me/Pr.O the_next_day/Adv.","Anh ấy nói anh ấy sẽ gọi tôi vào hôm sau."],
["My/D friend/N.S asked/V me/Pr.O if/C I/Pr.S could/Aux swim/V.","Bạn tôi hỏi tôi có biết bơi không."],
["The/D teacher/N.S asked/V us/Pr.O where/Q we/Pr.S lived/V.","Cô giáo hỏi chúng tôi sống ở đâu."],
["Mum/N.S told/V me/Pr.O to_tidy/V my/D room/N.O.","Mẹ bảo tôi dọn phòng."],
["Dad/N.S told/V us/Pr.O not/Adv to_shout/V.","Bố bảo chúng tôi không được la hét."]],
note:["<b>said</b> hay <b>told</b>? said <b>không</b> có túc từ người ngay sau (❌ said me); told <b>phải</b> có túc từ người (✅ told <b>me</b>, told <b>us</b>).","Câu hỏi tường thuật <b>không</b> có dấu “?” và không đảo trợ động từ: ❌ He asked where did I live? → ✅ He asked where I lived."],
q:[
{t:"mc",q:"“I am happy,” said Lan. → Lan said she ___ happy.",o:["is","was","were"],a:1,e:"Lùi thì: am → <b>was</b>."},
{t:"mc",q:"“I will help you,” he said. → He said he ___ help me.",o:["will","would","can"],a:1,e:"will → <b>would</b>."},
{t:"mc",q:"She ___ me that she was tired.",o:["said","told","asked"],a:1,e:"Có túc từ người (me) → <b>told</b>."},
{t:"mc",q:"“Do you like cats?” → She asked me ___ I liked cats.",o:["that","if","what"],a:1,e:"Câu hỏi Yes/No → <b>if</b>."},
{t:"f",q:"“Close the door!” → The teacher told me ___ close the door.",a:["to"],e:"Mệnh lệnh: told + người + <b>to</b> + V."},
{t:"f",q:"“I can dance,” said Mai. → Mai said she ___ dance.",a:["could"],e:"can → <b>could</b>."},
{t:"o",a:"He asked me where I lived.",e:"asked + me + where + S + V (không đảo)."}]},

{id:"a7",lv:3,t:"Gerunds & Infinitives",vi:"Danh động từ (V-ing) và động từ nguyên mẫu (to V)",
pic:{type:"grid",items:[["🏊","Swimming is fun.","V-ing làm chủ ngữ"],["🎨","I enjoy painting.","enjoy + V-ing"],["✈️","I want to travel.","want + to V"],["🧠","She is good at drawing.","giới từ + V-ing"]]},
ex:[
"Khi một động từ đi sau một động từ khác, nó phải có dạng <b>V-ing</b> hoặc <b>to + V</b>. Đây là chỗ học sinh hay nhầm nhất ở trình độ nâng cao.",
"<b>V-ing (danh động từ – gerund)</b> hoạt động như một <b>danh từ</b>: có thể làm <b>chủ ngữ</b> ([[Swimming/V.S]] [[is/V]] [[good/A]] [[for_you/P]]) hoặc <b>túc từ</b> ([[I/Pr.S]] [[enjoy/V]] [[reading/V.O]]).",
"<b>Động từ + V-ing:</b> enjoy, finish, mind, avoid, practise, keep, stop (dừng hẳn), miss, imagine, suggest, can't stand, don't mind. <b>Sau giới từ luôn dùng V-ing:</b> good at <b>drawing</b>, interested in <b>reading</b>, afraid of <b>flying</b>, thank you for <b>helping</b>, before <b>going</b> to bed, without <b>saying</b>.",
"<b>Động từ + to V:</b> want, would like, need, decide, hope, plan, learn, promise, agree, forget, try (cố gắng), offer, refuse, choose. Dùng to V để chỉ <b>mục đích</b>: I went to the shop <b>to buy</b> some milk.",
"<b>Cả hai, nghĩa giống nhau:</b> like, love, hate, start, begin, prefer (I like swimming / I like to swim).",
"<b>Cả hai, nghĩa khác nhau:</b> <i>stop doing</i> (thôi làm) ↔ <i>stop to do</i> (dừng lại để làm): He stopped <b>smoking</b> (bỏ thuốc). He stopped <b>to buy</b> water (dừng lại để mua nước). <i>remember / forget doing</i> (nhớ/quên đã làm) ↔ <i>remember / forget to do</i> (nhớ/quên phải làm)."],
f:[["V-ing làm chủ ngữ","S:V-ing + V:Động từ (số ít) + X:…"],["Động từ + V-ing","S:S + V:enjoy / finish / mind… + O:V-ing"],["Động từ + to V","S:S + V:want / decide / hope… + X:to + V:V nguyên mẫu"],["Giới từ + V-ing","A:good / interested / afraid + P:at / in / of + O:V-ing"]],
eg:[
["Reading/V.S comics/N is/V my/D hobby/N.","Đọc truyện tranh là sở thích của tôi."],
["She/Pr.S finished/V cleaning/V.O her/D room/N.","Cô ấy đã dọn xong phòng."],
["I'm/V good/A at/P drawing/V.O animals/N.","Tôi vẽ động vật giỏi."],
["We/Pr.S decided/V to_go/V camping/V.","Chúng tôi quyết định đi cắm trại."],
["He/Pr.S went/V to/P the/D library/N to_borrow/V some/D books/N.O.","Cậu ấy đến thư viện để mượn vài cuốn sách."],
["Don't/Aux forget/V to_lock/V the/D door/N.O.","Đừng quên khóa cửa nhé."],
["Thank_you/V for/P helping/V.O me/Pr.","Cảm ơn bạn đã giúp tôi."]],
note:["<b>Lỗi thường gặp:</b> ❌ I enjoy to swim. → ✅ I enjoy <b>swimming</b>. ❌ I want going. → ✅ I want <b>to go</b>. ❌ I'm interested in learn English. → ✅ interested in <b>learning</b>."],
q:[
{t:"mc",q:"I enjoy ___ to music.",o:["listen","to listen","listening"],a:2,e:"enjoy + <b>V-ing</b>."},
{t:"mc",q:"They decided ___ a new house.",o:["buying","to buy","buy"],a:1,e:"decide + <b>to V</b>."},
{t:"mc",q:"My brother is afraid of ___ in the dark.",o:["sleep","to sleep","sleeping"],a:2,e:"Sau giới từ of → <b>V-ing</b>."},
{t:"f",q:"___ (eat) vegetables is good for your health.",a:["eating"],e:"V-ing làm chủ ngữ → <b>Eating</b>."},
{t:"f",q:"I hope ___ (see) you soon.",a:["to see"],e:"hope + <b>to V</b>."},
{t:"mc",q:"He stopped ___ a photo of the waterfall. (dừng lại để chụp)",o:["taking","to take"],a:1,e:"stop to do = dừng lại để làm → <b>to take</b>."},

{id:"a8",lv:3,t:"Tag Questions",vi:"Câu hỏi đuôi",
pic:{type:"grid",items:[["➕➖","You are a student, aren't you?","khẳng định → đuôi phủ định"],["➖➕","She can't swim, can she?","phủ định → đuôi khẳng định"],["🔁","He likes milk, doesn't he?","mượn do/does/did"]]},
ex:[
"<b>Câu hỏi đuôi</b> là câu hỏi ngắn gắn vào cuối câu kể để <b>xác nhận</b> thông tin (…phải không?).",
"<b>Quy tắc 1 – ngược dấu:</b> câu kể khẳng định → đuôi <b>phủ định</b>; câu kể phủ định → đuôi <b>khẳng định</b>.",
"<b>Quy tắc 2 – lặp lại trợ động từ:</b> dùng lại to be / can / will / have / should… của câu kể. Nếu câu kể chỉ có động từ thường thì mượn <b>do / does / did</b>.",
"<b>Quy tắc 3 – chủ ngữ của đuôi luôn là đại từ:</b> Tom → he, Mary → she, the book → it, my parents → they, this/that → it, there → there.",
"<b>Trường hợp đặc biệt:</b> I am…, <b>aren't I</b>? · Let's…, <b>shall we</b>? · Câu mệnh lệnh…, <b>will you</b>? · Câu có never, no, nobody, hardly (mang nghĩa phủ định) → đuôi <b>khẳng định</b>: She never cries, <b>does she</b>?"],
f:[["Khẳng định","S:Câu khẳng định + X:, + Aux:trợ ĐT + n't + Pr:đại từ + X:?"],["Phủ định","S:Câu phủ định + X:, + Aux:trợ ĐT + Pr:đại từ + X:?"]],
eg:[
["It/Pr.S is/V cold/A today/Adv, isn't/V it/Pr?","Hôm nay lạnh nhỉ?"],
["You/Pr.S can/Aux ride/V a/D bike/N.O, can't/Aux you/Pr?","Bạn biết đi xe đạp phải không?"],
["Tom/N.S likes/V football/N.O, doesn't/Aux he/Pr?","Tom thích bóng đá phải không?"],
["They/Pr.S didn't/Aux come/V, did/Aux they/Pr?","Họ không đến phải không?"],
["Your/D mum/N.S has/Aux been/V to/P Japan/N, hasn't/Aux she/Pr?","Mẹ bạn đã từng đến Nhật phải không?"],
["Let's/V go/V to/P the/D beach/N, shall/Aux we/Pr?","Mình đi biển nhé?"],
["I'm/V late/A, aren't/V I/Pr?","Tôi đến muộn phải không?"]],
note:["<b>Lỗi thường gặp:</b> ❌ Lan is nice, isn't Lan? → ✅ …, isn't <b>she</b>? ❌ He plays chess, isn't he? → ✅ …, <b>doesn't</b> he?"],
q:[
{t:"f",q:"She is your sister, ___ she?",a:["isn't"],e:"is (khẳng định) → <b>isn't</b>."},
{t:"f",q:"You don't like fish, ___ you?",a:["do"],e:"don't (phủ định) → <b>do</b>."},
{t:"mc",q:"Peter went to the zoo, ___?",o:["didn't he","wasn't he","doesn't he"],a:0,e:"went (quá khứ đơn) → <b>didn't he</b>."},
{t:"mc",q:"They can speak French, ___?",o:["can they","can't they","don't they"],a:1,e:"can → <b>can't they</b>."},
{t:"mc",q:"Let's play a game, ___?",o:["will we","shall we","don't we"],a:1,e:"Let's → <b>shall we</b>."},
{t:"mc",q:"He never eats meat, ___?",o:["does he","doesn't he","is he"],a:0,e:"never mang nghĩa phủ định → đuôi khẳng định <b>does he</b>."},
{t:"mc",q:"I'm clever, ___?",o:["amn't I","aren't I","am I"],a:1,e:"Đặc biệt: I am → <b>aren't I</b>."}]},

{id:"a9",lv:3,t:"Word Formation",vi:"Cấu tạo từ: nhận biết từ loại qua tiền tố, hậu tố",
pic:{type:"table",head:["Danh từ","Động từ","Tính từ","Trạng từ"],rows:[["happiness","—","happy","happily"],["success","succeed","successful","successfully"],["decision","decide","decisive","decisively"],["danger","endanger","dangerous","dangerously"],["care","care","careful / careless","carefully"],["beauty","beautify","beautiful","beautifully"]]},
ex:[
"Đây là kỹ năng giúp em <b>đoán từ loại</b> của một từ mới chỉ bằng cách nhìn đuôi của nó – rất hay gặp trong bài thi “Word form”: điền dạng đúng của từ trong ngoặc.",
"<b>Bước 1 – nhìn vị trí</b> để biết cần từ loại nào: sau a/an/the/my/this → cần <b>danh từ</b> (hoặc tính từ + danh từ); sau to be / look / feel → cần <b>tính từ</b>; bổ nghĩa cho động từ → cần <b>trạng từ</b>; sau chủ ngữ, sau can/will/to → cần <b>động từ</b>.",
"<b>Đuôi danh từ:</b> -tion / -sion (education, decision), -ment (movement, government), -ness (kindness, happiness), -er / -or / -ist (teacher, actor, artist – chỉ người), -ity (activity), -ance / -ence (difference), -ship (friendship), -hood (childhood).",
"<b>Đuôi tính từ:</b> -ful (useful), -less (useless), -ous (famous), -y (rainy), -al (natural), -ive (active), -able / -ible (comfortable, possible), -ic (scientific), -ing / -ed (exciting, excited).",
"<b>Đuôi động từ:</b> -ise / -ize (realise), -en (widen, shorten), -ify (simplify). <b>Đuôi trạng từ:</b> -ly (quickly, carefully).",
"<b>Tiền tố phủ định</b> (đổi nghĩa thành ngược lại, không đổi từ loại): un- (unhappy), im- (impossible), in- (incorrect), dis- (dislike), ir- (irregular)."],
f:[["Cần danh từ","D:a / the / my + A:(tính từ) + N:___"],["Cần tính từ","V:be / look / feel + A:___ · D:a + A:___ + N:Danh từ"],["Cần trạng từ","V:Động từ + O:(túc từ) + Adv:___"]],
eg:[
["Thank_you/V for/P your/D kindness/N.O.","Cảm ơn lòng tốt của bạn."],
["The/D singer/N.S is/V very/Adv famous/A.","Ca sĩ đó rất nổi tiếng."],
["She/Pr.S answered/V the/D question/N.O correctly/Adv.","Cô ấy trả lời câu hỏi đúng."],
["Our/D friendship/N.S is/V important/A to/P me/Pr.O.","Tình bạn của chúng ta quan trọng với tôi."],
["It's/V impossible/A to_finish/V this/D today/Adv.","Không thể hoàn thành việc này hôm nay."],
["The/D new/A sofa/N.S is/V very/Adv comfortable/A.","Ghế sofa mới rất thoải mái."],
["He/Pr.S is/V a/D careless/A driver/N. He/Pr.S drives/V carelessly/Adv.","Anh ấy là tài xế bất cẩn. Anh ấy lái xe ẩu."]],
note:["<b>Mẹo làm bài:</b> đọc cả câu, xác định chỗ trống cần <b>từ loại</b> gì trước, rồi mới chọn đuôi. Kiểm tra lại <b>nghĩa</b> (khẳng định hay phủ định: careful hay careless?) và <b>số ít/số nhiều</b> nếu là danh từ."],
q:[
{t:"mc",q:"She is a ___ dancer. (beauty)",o:["beauty","beautiful","beautifully"],a:1,e:"Trước danh từ dancer → tính từ <b>beautiful</b>."},
{t:"mc",q:"He sings ___ . (beauty)",o:["beautiful","beautifully","beauty"],a:1,e:"Bổ nghĩa cho động từ sings → trạng từ <b>beautifully</b>."},
{t:"f",q:"Lan is my best friend. Our ___ (friend) is very special.",a:["friendship"],e:"Sau our cần danh từ → <b>friendship</b>."},
{t:"f",q:"Be ___ (care)! The floor is wet.",a:["careful"],e:"Sau be cần tính từ → <b>careful</b>."},
{t:"f",q:"My dad works as a ___ (paint).",a:["painter"],e:"Sau a cần danh từ chỉ người → <b>painter</b>."},
{t:"mc",q:"Từ nào là <b>danh từ</b>?",o:["educate","educational","education","educationally"],a:2,e:"Đuôi -tion → danh từ <b>education</b>."},
{t:"mc",q:"Từ nào là <b>động từ</b>?",o:["wide","widen","width","widely"],a:1,e:"Đuôi -en → động từ <b>widen</b> (làm rộng ra)."},
{t:"f",q:"I can't do it. It's ___ (possible).",a:["impossible"],e:"Nghĩa phủ định → <b>impossible</b>."},
{t:"f",q:"The test was very easy. I finished it ___ (easy).",a:["easily"],e:"Bổ nghĩa cho finished → trạng từ <b>easily</b>."}]},

{id:"a10",lv:3,t:"Used to",vi:"Thói quen trong quá khứ: used to",
pic:{type:"time",m:"pastRange",cap:"Thói quen / trạng thái kéo dài trong quá khứ, bây giờ không còn nữa"},
ex:[
"<b>used to + V nguyên mẫu</b> diễn tả <b>thói quen hoặc trạng thái trong quá khứ</b> mà <b>bây giờ không còn nữa</b>: I <b>used to</b> cry a lot when I was a baby (bây giờ không khóc nhiều nữa).",
"Dùng cho <b>mọi chủ ngữ</b>, không đổi: I / she / they used to…",
"<b>Phủ định:</b> didn't <b>use</b> to + V (bỏ d). <b>Câu hỏi:</b> Did + S + <b>use</b> to + V? <i>Did you use to have long hair?</i>",
"<b>Phân biệt:</b> <i>be used to + V-ing</i> = <b>đã quen với</b> việc gì (I'm used to getting up early). Đây là cấu trúc khác hoàn toàn!"],
f:[["Khẳng định","S:Chủ ngữ + Aux:used to + V:V nguyên mẫu"],["Phủ định","S:Chủ ngữ + Aux:didn't use to + V:V nguyên mẫu"],["Câu hỏi","Aux:Did + S:Chủ ngữ + X:use to + V:V nguyên mẫu + X:?"]],
eg:[
["I/Pr.S used_to/Aux live/V in/P a/D small/A village/N.","Tôi từng sống ở một ngôi làng nhỏ."],
["My/D dad/N.S used_to/Aux play/V the/D guitar/N.O.","Bố tôi từng chơi ghi-ta."],
["There/Pr used_to/Aux be/V a/D cinema/N.S here/Adv.","Ở đây từng có một rạp chiếu phim."],
["She/Pr.S didn't_use_to/Aux like/V vegetables/N.O.","Trước đây cô ấy không thích rau."],
["Did/Aux you/Pr.S use_to/Aux watch/V cartoons/N.O?","Hồi trước bạn có hay xem phim hoạt hình không?"]],
note:["<b>Lỗi thường gặp:</b> ❌ I use to play (khẳng định) → ✅ I <b>used</b> to play. ❌ Did you used to → ✅ Did you <b>use</b> to."],
q:[
{t:"mc",q:"When I was five, I ___ sleep with a teddy bear.",o:["use to","used to","am used to"],a:1,e:"Thói quen quá khứ → <b>used to</b>."},
{t:"mc",q:"Did he ___ have a beard?",o:["used to","use to","using to"],a:1,e:"Câu hỏi với did → <b>use to</b>."},
{t:"f",q:"We ___ to go fishing with Grandpa every summer. (đã từng)",a:["used"],e:"<b>used</b> to."},
{t:"mc",q:"“I used to be shy.” nghĩa là:",o:["Bây giờ tôi vẫn nhút nhát","Trước đây tôi nhút nhát, giờ không còn","Tôi đã quen với việc nhút nhát"],a:1,e:"used to = trước đây có, bây giờ không còn."},
{t:"o",a:"My grandma used to tell me stories.",e:"S + used to + V + túc từ gián tiếp + túc từ trực tiếp."}]},

{id:"a11",lv:3,t:"Wishes",vi:"Câu ước với wish",
pic:{type:"grid",items:[["🐶✨","I wish I had a dog.","ước ở hiện tại"],["☀️","I wish it would stop raining.","ước ở tương lai"],["😢📝","I wish I had studied harder.","ước ở quá khứ (tiếc)"]]},
ex:[
"<b>wish</b> (ước) dùng để nói về điều <b>trái với thực tế</b> mà mình mong muốn.",
"<b>Ước ở hiện tại:</b> S + wish + S + <b>quá khứ đơn</b> (to be dùng <b>were</b>): <i>I wish I <b>were</b> taller.</i> (Thực tế: tôi không cao.) <i>I wish I <b>could</b> fly.</i>",
"<b>Ước ở tương lai</b> (mong điều gì đó thay đổi): S + wish + S + <b>would</b> + V: <i>I wish it <b>would</b> stop raining.</i>",
"<b>Ước ở quá khứ</b> (tiếc nuối): S + wish + S + <b>had + V3</b>: <i>I wish I <b>had brought</b> my umbrella.</i> (Thực tế: tôi đã không mang ô.)",
"<b>If only</b> = I wish, nhưng cảm xúc mạnh hơn: <i>If only I had more time!</i>"],
f:[["Hiện tại","S:S + V:wish + S:S + V:V2 / were / could + V"],["Tương lai","S:S + V:wish + S:S + Aux:would + V:V nguyên mẫu"],["Quá khứ","S:S + V:wish + S:S + Aux:had + V:V3"]],
eg:[
["I/Pr.S wish/V I/Pr.S had/V a/D big/A garden/N.O.","Ước gì tôi có một khu vườn rộng."],
["She/Pr.S wishes/V she/Pr.S were/V a/D princess/N.","Cô bé ước mình là công chúa."],
["I/Pr.S wish/V I/Pr.S could/Aux speak/V English/N.O fluently/Adv.","Ước gì tôi nói tiếng Anh trôi chảy."],
["We/Pr.S wish/V the/D holiday/N.S would/Aux come/V soon/Adv.","Chúng tôi mong kỳ nghỉ đến sớm."],
["He/Pr.S wishes/V he/Pr.S hadn't/Aux eaten/V so_much/Adv.","Cậu ấy ước gì mình đã không ăn nhiều như vậy."]],
note:["<b>Lỗi thường gặp:</b> ❌ I wish I have a bike. → ✅ I wish I <b>had</b> a bike. ❌ I wish I was (chấp nhận trong văn nói) → bài thi dùng <b>were</b>."],
q:[
{t:"mc",q:"I wish I ___ a robot.",o:["have","had","will have"],a:1,e:"Ước hiện tại → quá khứ đơn <b>had</b>."},
{t:"mc",q:"She wishes she ___ older.",o:["is","were","be"],a:1,e:"to be trong câu ước → <b>were</b>."},
{t:"mc",q:"I wish I ___ harder for the test last week.",o:["studied","had studied","would study"],a:1,e:"Ước quá khứ → <b>had studied</b>."},
{t:"f",q:"I wish I ___ swim. (có thể – dùng can lùi thì)",a:["could"],e:"can → <b>could</b>."},
{t:"f",q:"I wish my brother ___ stop making noise. (tương lai)",a:["would"],e:"Mong ai đó thay đổi → <b>would</b>."},
{t:"o",a:"I wish I lived near the sea.",e:"I wish + S + quá khứ đơn."}]}
);

// ================= tagged sentences =================
const SENTS = [];
function parse(str){
  return str.split(/\s+/).filter(Boolean).map(raw=>{
    const m = raw.match(/^(.+?)\/([A-Za-z]+)(?:\.(Oi|S|O))?([.,!?;:]*)$/);
    if(!m || !POS[m[2]]) return {w:raw.replace(/_/g," "),plain:true};
    return {w:m[1].replace(/_/g," "),c:m[2],r:m[3]||"",p:m[4]||""};
  });
}
const plainText = toks => toks.map(t=>t.w+(t.p||"")).join(" ");
function labelOf(t){return POS[t.c].vi.toLowerCase()+(t.r?" · "+ROLE[t.r].vi.toLowerCase():"");}
function tokenHTML(t,sid,i){
  if(t.plain) return `<span class="pl">${esc(t.w)}</span>`;
  return `<button class="tk k-${t.c}${t.r?" r-"+t.r:""}" data-s="${sid}" data-i="${i}" title="${esc(labelOf(t))}"><span class="w">${esc(t.w)}${esc(t.p)}</span><span class="lb">${esc(labelOf(t))}</span></button>`;
}
function sentence(str){
  const toks = typeof str==="string"?parse(str):str;
  const sid = SENTS.push(toks)-1;
  return `<div class="sent" data-sid="${sid}">${toks.map((t,i)=>tokenHTML(t,sid,i)).join("")}</div>`;
}
function inline(html){
  return html.replace(/\[\[(.+?)\]\]/g,(_,s)=>{const t=parse(s)[0]; if(t.plain) return esc(t.w);
    return `<span class="ic k-${t.c}" title="${esc(labelOf(t))}">${esc(t.w)}</span>`;});
}

function explain(toks,i){
  const t=toks[i], P=POS[t.c], out=[];
  const tg = j => (toks[j]&&!toks[j].plain)?toks[j]:null;
  const next=(from,pred)=>{for(let j=from;j<toks.length;j++){const x=tg(j);if(x&&pred(x))return x;}return null;};
  const prev=(from,pred)=>{for(let j=from;j>=0;j--){const x=tg(j);if(x&&pred(x))return x;}return null;};
  const q = w => `<b>“${esc(w)}”</b>`;
  const lw = t.w.toLowerCase();
  out.push(`<p><b>${P.vi}</b> (${P.en}): ${P.desc}</p>`);
  if(t.r==="S"){const v=next(i+1,x=>x.c==="V"||x.c==="Aux");
    out.push(`<p><b>Vai trò: Chủ ngữ.</b> Đây là người/vật mà câu đang nói đến${v?`, đi với động từ ${q(v.w)}`:""}. Chủ ngữ thường đứng đầu câu, trước động từ. Hỏi: “Ai / cái gì ${v?esc(v.w):"…"}?” → ${q(t.w)}.</p>`);
    if(t.c==="V") out.push(`<p>Đây là <b>danh động từ</b> (V-ing): động từ thêm -ing để dùng như một danh từ, nên có thể làm chủ ngữ.</p>`);}
  if(t.r==="O"){const v=prev(i-1,x=>x.c==="V"||x.c==="P");
    if(v&&v.c==="P") out.push(`<p><b>Vai trò: Túc từ của giới từ.</b> Nó đứng sau giới từ ${q(v.w)}. Sau giới từ, đại từ luôn ở dạng túc từ (me, him, her, us, them).</p>`);
    else out.push(`<p><b>Vai trò: Túc từ</b> (tân ngữ). Nó nhận tác động của động từ ${v?q(v.w):""}. Hỏi: “${v?esc(v.w):"Động từ"} + cái gì / ai?” → ${q(t.w)}. Túc từ đứng sau động từ.</p>`);
    if(t.c==="Pr") out.push(`<p>Vì là túc từ nên đại từ phải dùng <b>dạng túc từ</b>: me, you, him, her, it, us, them.</p>`);
    if(t.c==="V") out.push(`<p>Đây là <b>danh động từ</b> (V-ing): động từ thêm -ing dùng như một danh từ, nên làm được túc từ.</p>`);}
  if(t.r==="Oi"){const v=prev(i-1,x=>x.c==="V"),o=next(i+1,x=>x.r==="O");
    out.push(`<p><b>Vai trò: Túc từ gián tiếp</b> – người nhận. Nó đứng ngay sau động từ ${v?q(v.w):""}${o?` và trước túc từ trực tiếp ${q(o.w)}`:""}. Có thể đổi thành: …${o?esc(o.w):"vật"} <b>to/for</b> ${esc(t.w)}.</p>`);}
  if(t.c==="A"){let j=i+1;while(tg(j)&&tg(j).c==="A")j++;const n=tg(j);
    const pv=prev(i-1,x=>x.c==="V"||x.c==="Aux");
    if(n&&n.c==="N") out.push(`<p>Bổ nghĩa cho danh từ ${q(n.w)} đứng ngay sau nó. Tính từ tiếng Anh đứng <b>trước</b> danh từ.</p>`);
    else if(pv&&LINKV.includes(pv.w.toLowerCase())){const s=prev(i-1,x=>x.r==="S");out.push(`<p>Đứng sau động từ nối ${q(pv.w)}, miêu tả cho chủ ngữ${s?" "+q(s.w):""}.</p>`);}}
  if(t.c==="Adv"){
    if(["very","so","really","too","quite"].includes(lw)){const n=next(i+1,x=>x.c==="A"||x.c==="Adv"||x.c==="D");if(n) out.push(`<p>Trạng từ chỉ <b>mức độ</b>, bổ nghĩa cho ${q(n.w)} đứng sau.</p>`);}
    else if(lw==="not") out.push(`<p>Dùng để tạo câu <b>phủ định</b>.</p>`);
    else {const v=prev(i-1,x=>x.c==="V")||next(i+1,x=>x.c==="V");if(v) out.push(`<p>Bổ nghĩa cho động từ ${q(v.w)}: cho biết hành động diễn ra như thế nào, khi nào, ở đâu hoặc bao lâu một lần.</p>`);}
    if(/ly$/.test(lw)&&lw.length>4) out.push(`<p>Dấu hiệu: tận cùng bằng <b>-ly</b>.</p>`);}
  if(t.c==="D"){const n=next(i+1,x=>x.c==="N");if(n) out.push(`<p>Đứng trước để xác định cho danh từ ${q(n.w)}.</p>`);}
  if(t.c==="P"){const n=next(i+1,x=>x.c==="N"||x.c==="Pr"||x.c==="V");if(n) out.push(`<p>Đi với ${q(n.w)} phía sau, tạo thành cụm giới từ chỉ vị trí, thời gian hoặc hướng.</p>`);}
  if(t.c==="Aux"){const v=next(i+1,x=>x.c==="V");if(v) out.push(`<p>Đi cùng động từ chính ${q(v.w)} để tạo thì, câu hỏi, câu phủ định hoặc thêm nghĩa.</p>`);}
  if(t.c==="V"&&!t.r){
    if(BE.includes(lw)) out.push(`<p>Đây là động từ <b>to be</b> (là, thì, ở). Phần đứng sau nó là <b>bổ ngữ</b> miêu tả chủ ngữ, không phải túc từ.</p>`);
    let o=null;for(let j=i+1;j<toks.length;j++){const x=tg(j);if(!x)continue;if(x.c==="V"||x.c==="Aux"||x.c==="C")break;if(x.r==="O"||x.r==="Oi"){o=x;break;}}
    if(o) out.push(`<p>Động từ này có túc từ ${q(o.w)} theo sau.</p>`);}
  if(t.c==="N"&&!t.r){const pv=tg(i-1)&&tg(i-1).c==="P"?tg(i-1):(tg(i-2)&&tg(i-2).c==="P"&&(tg(i-1)||{}).c!=="V"?tg(i-2):null);
    if(pv) out.push(`<p>Đứng sau giới từ ${q(pv.w)}.</p>`);
    else {const b=prev(i-1,x=>x.c==="V");if(b&&BE.includes(b.w.toLowerCase())) out.push(`<p>Đứng sau to be ${q(b.w)}, làm <b>bổ ngữ</b> cho chủ ngữ.</p>`);}}
  return out.join("");
}

function picHTML(p){
  if(Array.isArray(p)) return p.map(picHTML).join("");
  const cap = p.cap?`<div class="cap">${esc(p.cap)}</div>`:"";
  if(p.type==="grid") return `<div class="pic"><div class="pgrid">${p.items.map(([e,t,s])=>`<div class="pcell"><div class="em" aria-hidden="true">${e}</div><div class="t">${esc(t)}</div>${s?`<div class="s">${esc(s)}</div>`:""}</div>`).join("")}</div>${cap}</div>`;
  if(p.type==="svo"){
    const box=(x,role,cls)=>`<div class="fbox ${cls}"><div class="em" aria-hidden="true">${x[0]}</div><div class="t">${esc(x[1])}</div><div class="r">${role}</div></div>`;
    const arrow=`<div class="farrow"><span>${esc(p.v)}</span><span class="line"></span><span class="r">Động từ</span></div>`;
    return `<div class="pic"><div class="flow">${box(p.s,p.nr?"Chủ ngữ (bị tác động)":"Chủ ngữ","S")}${arrow}${p.oi?box(p.oi,"Túc từ gián tiếp","O"):""}${box(p.o,p.nr?"Người thực hiện":"Túc từ",p.nr?"":"O")}</div>${cap}</div>`;}
  if(p.type==="time") return `<div class="pic">${timeline(p.m)}${cap}</div>`;
  if(p.type==="prep") return `<div class="pic">${prepPics()}<div class="cap">Quả bóng đỏ ở đâu so với chiếc hộp?</div></div>`;
  if(p.type==="cmp") return `<div class="pic"><div class="cmp">${p.items.map(([e,l,s])=>`<div><span style="font-size:${s}px;line-height:1.1;display:block" aria-hidden="true">${e}</span>${esc(l)}</div>`).join("")}</div>${cap}</div>`;
  if(p.type==="freq") return `<div class="pic"><div class="freq">${p.items.map(([w,v])=>`<div class="fq"><span class="ic k-Adv" style="justify-self:start">${w}</span><span class="tb"><i style="width:${v}%"></i></span><span>${v}%</span></div>`).join("")}</div></div>`;
  if(p.type==="table"){const ks=["N","V","A","Adv"];return `<div class="pic"><div class="tbl" style="border:0;background:transparent"><table><thead><tr>${p.head.map((h,i)=>`<th><span class="ic k-${ks[i]}">${h}</span></th>`).join("")}</tr></thead><tbody>${p.rows.map(r=>`<tr>${r.map((c,i)=>`<td style="color:var(--${["n","v","a","adv"][i]});font-weight:800">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;}
  return "";
}
function timeline(m){
  const wave=(x1,x2,y=66)=>{let d=`M${x1} ${y}`;for(let x=x1;x<x2;x+=20)d+=" q5 -11 10 0 q5 11 10 0";return `<path class="wv" d="${d}"/>`;};
  let g="";
  if(m==="repeat"){for(let x=60;x<=540;x+=48) g+=`<circle class="mk" cx="${x}" cy="66" r="7"/>`;}
  if(m==="now"){g+=wave(240,360)+`<circle class="mk" cx="300" cy="100" r="6"/>`;}
  if(m==="past"){g+=`<line class="ds" x1="130" y1="78" x2="130" y2="98"/><circle class="mk" cx="130" cy="64" r="11"/>`;}
  if(m==="pastRange"){g+=wave(60,220);}
  if(m==="future"){g+=`<path class="ds" d="M300 64 H452"/><circle class="mk" cx="470" cy="64" r="11"/>`;}
  if(m==="pastToNow"){g+=`<circle class="mk" cx="110" cy="64" r="8"/><path class="ar" d="M110 64 H288"/><path class="arh" d="M300 64 L284 55 L284 73 Z"/>`;}
  if(m==="pastInterrupt"){g+=wave(60,220)+`<polygon class="bolt" points="152,30 138,64 152,64 142,96 170,54 155,54 166,30"/>`;}
  return `<svg class="tl" viewBox="0 0 600 150" role="img" aria-label="Trục thời gian">
  <line class="ax" x1="30" y1="100" x2="566" y2="100"/><path d="M572 100 L560 93 L560 107 Z" fill="var(--muted)"/>
  <line class="tick" x1="120" y1="93" x2="120" y2="107"/><line class="tick" x1="300" y1="91" x2="300" y2="109"/><line class="tick" x1="480" y1="93" x2="480" y2="107"/>
  ${g}
  <text x="120" y="132" text-anchor="middle">Quá khứ · past</text><text class="now" x="300" y="132" text-anchor="middle">Bây giờ · now</text><text x="480" y="132" text-anchor="middle">Tương lai · future</text></svg>`;
}

// ================= formula =================
function formulaHTML(f){
  return f.split(" + ").map(part=>{
    const m=part.match(/^([A-Za-z]+):(.*)$/); if(!m) return `<span class="fp X">${esc(part)}</span>`;
    const k=m[1], txt=m[2];
    if(k==="S"||k==="O"||k==="X") return `<span class="fp ${k}">${esc(txt)}</span>`;
    return `<span class="fp k-${k}">${esc(txt)}</span>`;
  }).join('<span class="plus">+</span>');
}

// ================= questions =================
const KIND={mc:"Trắc nghiệm",f:"Điền vào chỗ trống",o:"Sắp xếp câu",pos:"Nhận diện từ loại",obj:"Tìm túc từ"};
function feedback(el,ok,html){
  const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"no");
  fb.innerHTML=`<b class="h">${ok?"Chính xác!":"Chưa đúng."}</b>${html||""}`;el.appendChild(fb);
}
function mountQ(q,n,done){
  const el=document.createElement("div");el.className="q";
  const head=(t)=>`<div class="qh"><span class="qn">${n}</span><div class="qt"><span class="kind">${q.kind||KIND[q.t]}</span>${t}</div></div>`;
  const finish=(ok,html)=>{el.classList.add(ok?"ok":"no");feedback(el,ok,html);done&&done(ok);};
  if(q.t==="mc"){
    el.innerHTML=head(inline(q.q))+(q.pre||"")+`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>`;
    $$(".opt",el).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i,ok=i===q.a;$$(".opt",el).forEach(x=>x.disabled=true);
      b.classList.add(ok?"right":"wrong");if(!ok)$$(".opt",el)[q.a].classList.add("right");
      finish(ok,q.e?`<div>${inline(q.e)}</div>`:"");
    });
  }
  if(q.t==="f"){
    const id="f"+Math.random().toString(36).slice(2,8);
    el.innerHTML=head(inline(q.q).replace("___","<b>___</b>"))+(q.pre||"")+`<div class="fill"><input id="${id}" autocomplete="off" spellcheck="false" placeholder="Gõ câu trả lời…" aria-label="Câu trả lời"><button class="btn">Kiểm tra</button></div>`;
    const inp=$("input",el),btn=$("button.btn",el);
    const check=()=>{if(!inp.value.trim()||inp.disabled)return;const ok=q.a.some(a=>norm(a)===norm(inp.value));
      inp.disabled=true;btn.disabled=true;inp.classList.add(ok?"right":"wrong");
      finish(ok,(ok?"":`<div>Đáp án: <b>${esc(q.a[0])}</b></div>`)+(q.e?`<div>${inline(q.e)}</div>`:""));};
    btn.onclick=check;inp.onkeydown=e=>{if(e.key==="Enter")check();};
  }
  if(q.t==="o"){
    const punct=(q.a.match(/[.?!]$/)||[""])[0], words=q.a.replace(/[.?!]$/,"").split(" ");
    let bank=shuffle(words.map((w,i)=>({w,i})));if(bank.length>2&&bank.every((x,k)=>x.i===k))bank=bank.reverse();
    let built=[];
    el.innerHTML=head("Sắp xếp các từ thành câu đúng:")+`<div class="ord"></div><div class="wb"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">Kiểm tra</button><button class="btn ghost">Làm lại</button></div>`;
    const ord=$(".ord",el),wb=$(".wb",el),[btn,rst]=$$("button.btn",el);
    const draw=()=>{ord.innerHTML=built.map((x,k)=>`<button class="wbtn" data-k="${k}">${esc(x.w)}</button>`).join("");
      wb.innerHTML=bank.map((x,k)=>`<button class="wbtn" data-k="${k}">${esc(x.w)}</button>`).join("");
      $$(".wbtn",wb).forEach(b=>b.onclick=()=>{built.push(bank.splice(+b.dataset.k,1)[0]);draw();});
      $$(".wbtn",ord).forEach(b=>b.onclick=()=>{bank.push(built.splice(+b.dataset.k,1)[0]);draw();});
      btn.disabled=bank.length>0;};
    draw();
    rst.onclick=()=>{bank=shuffle(bank.concat(built));built=[];draw();};
    btn.onclick=()=>{const ok=norm(built.map(x=>x.w).join(" "))===norm(q.a);
      $$(".wbtn",el).forEach(b=>b.disabled=true);btn.disabled=true;rst.disabled=true;
      finish(ok,(ok?"":`<div>Câu đúng: <b>${esc(q.a)}</b></div>`)+(q.e?`<div>${inline(q.e)}</div>`:""));};
    void punct;
  }
  if(q.t==="pos"){
    const toks=q.toks,t=toks[q.i];
    const pool=["N","V","A","Adv","Pr","P","D","Aux","C"].filter(k=>k!==t.c);
    const opts=shuffle([t.c].concat(shuffle(pool).slice(0,3)));
    el.innerHTML=head(`Từ được tô đậm <b>“${esc(t.w)}”</b> thuộc từ loại nào?`)+
      `<div class="sent" style="margin-bottom:12px">${toks.map((x,i)=>i===q.i?`<span class="tk target"><span class="w">${esc(x.w)}${esc(x.p||"")}</span></span>`:`<span class="pl">${esc(x.w)}${esc(x.p||"")}</span>`).join("")}</div>`+
      `<div class="opts">${opts.map(k=>`<button class="opt" data-k="${k}">${POS[k].vi}</button>`).join("")}</div>`;
    $$(".opt",el).forEach(b=>b.onclick=()=>{const ok=b.dataset.k===t.c;$$(".opt",el).forEach(x=>x.disabled=true);
      b.classList.add(ok?"right":"wrong");if(!ok)$(`.opt[data-k="${t.c}"]`,el).classList.add("right");
      finish(ok,`<div style="margin:8px 0">${sentence(toks)}</div><div><b>${esc(t.w)}</b> là <b>${POS[t.c].vi}</b>${t.r?`, vai trò <b>${ROLE[t.r].vi}</b>`:""}.</div>${explain(toks,q.i)}`);});
  }
  if(q.t==="obj"){
    const toks=q.toks;
    el.innerHTML=head("Bấm vào <b>túc từ</b> (tân ngữ) trong câu – từ nhận tác động của động từ:")+
      `<div class="sent">${toks.map((x,i)=>x.plain?`<span class="pl">${esc(x.w)}</span>`:`<button class="tk plain" data-j="${i}"><span class="w">${esc(x.w)}${esc(x.p||"")}</span></button>`).join("")}</div>`;
    $$(".tk.plain",el).forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j,ok=toks[j].r==="O"||toks[j].r==="Oi";$$(".tk.plain",el).forEach(x=>x.disabled=true);
      const oi=toks.findIndex(x=>x.r==="O"||x.r==="Oi");
      finish(ok,`<div style="margin:8px 0">${sentence(toks)}</div><div>Túc từ là <b>${toks.filter(x=>x.r==="O"||x.r==="Oi").map(x=>esc(x.w)).join(", ")}</b> (khung nét đứt).</div>${explain(toks,oi)}`);});
  }
  return el;
}

// generators
function allTagged(){const s=[];LESSONS.forEach(l=>l.eg.forEach(e=>s.push(e[0])));POS_GUIDE.forEach(p=>p.eg.forEach(e=>s.push(e)));ANALYZE.forEach(e=>s.push(e));return s;}
const SKIPW=["there","it's","let's","that's","i'm","they're"];
function genPos(src){
  for(let k=0;k<30;k++){const toks=parse(pick(src));const idx=toks.map((t,i)=>(!t.plain&&!SKIPW.includes(t.w.toLowerCase())&&!t.w.includes(" "))?i:-1).filter(i=>i>=0);
    if(idx.length) return {t:"pos",toks,i:pick(idx)};}
}
function genObj(src){const c=src.filter(s=>/\.(O|Oi)\b/.test(s));if(!c.length)return null;return {t:"obj",toks:parse(pick(c))};}

function viewLessons(){
  const done=LESSONS.filter(l=>store.lessons[l.id]);
  const avg=done.length?Math.round(done.reduce((a,l)=>a+store.lessons[l.id].best,0)/done.length):0;
  const lv=state.level;
  let html=`<div class="view-head"><div><div class="eyebrow">Ngữ pháp tiếng Anh</div><h1>Bài học từ cơ bản đến nâng cao</h1>
  <p>${LESSONS.length} bài, mỗi bài có giải thích bằng tiếng Việt, công thức tô màu, hình minh họa, ví dụ có dịch nghĩa và bài tập chấm điểm ngay. Bấm vào bất kỳ từ tô màu nào để xem nó là từ loại gì và đóng vai trò gì trong câu.</p></div>
  <div class="stats"><div class="stat"><b>${done.length}/${LESSONS.length}</b><span>bài đã làm</span><div class="bar"><i style="width:${done.length/LESSONS.length*100}%"></i></div></div><div class="stat"><b>${avg}%</b><span>điểm trung bình</span></div></div></div>
  ${legendHTML()}
  <div class="chips" role="group" aria-label="Lọc cấp độ">${[[0,"Tất cả"],[1,"Cơ bản"],[2,"Trung cấp"],[3,"Nâng cao"]].map(([k,t])=>`<button class="chip" data-lv="${k}" aria-pressed="${lv===k}">${t}</button>`).join("")}</div>`;
  [1,2,3].filter(l=>!lv||l===lv).forEach(l=>{
    const ls=LESSONS.filter(x=>x.lv===l);
    html+=`<div class="lvl"><h2>${LEVELS[l].vi}</h2><span>${LEVELS[l].sub} · ${ls.length} bài</span></div><div class="lgrid">`+
    ls.map(x=>{const n=LESSONS.indexOf(x)+1,s=store.lessons[x.id];
      return `<button class="lcard${s?" done":""}" data-id="${x.id}"><span class="lnum">${n}</span><h3>${esc(x.t)}</h3><span class="vi">${esc(x.vi)}</span>
      <span class="meta">${x.eg.length} ví dụ · ${x.q.length+4} bài tập${s?` · <span class="sc">${s.best}%</span>`:""}</span></button>`;}).join("")+`</div>`;
  });
  app.innerHTML=html;
  $$(".chip[data-lv]").forEach(b=>b.onclick=()=>{state.level=+b.dataset.lv;viewLessons();});
  $$(".lcard").forEach(b=>b.onclick=()=>go("lesson",{lesson:b.dataset.id}));
}

function viewLesson(){
  const L=LESSONS.find(l=>l.id===state.lesson), n=LESSONS.indexOf(L);
  const prev=LESSONS[n-1], next=LESSONS[n+1];
  const egStr=L.eg.map(e=>e[0]);
  app.innerHTML=`<button class="back" id="back">← Tất cả bài học</button>
  <div class="lesson"><article class="paper">
    <div class="lhead"><span class="lnum" style="width:46px;height:46px;font-size:20px;flex:none">${n+1}</span><div><div class="eyebrow">${LEVELS[L.lv].vi} · ${LEVELS[L.lv].sub}</div><h1>${esc(L.t)}</h1><div class="vi">${esc(L.vi)}</div></div></div>
    <section class="sec" id="s-pic"><h2><span class="n">1</span>Hình minh họa</h2>${picHTML(L.pic)}</section>
    <section class="sec prose" id="s-ex"><h2><span class="n">2</span>Giải thích chi tiết</h2>${L.ex.map(p=>`<p>${inline(p)}</p>`).join("")}</section>
    <section class="sec" id="s-f"><h2><span class="n">3</span>Công thức</h2><div class="formula">${L.f.map(([c,f])=>`<div class="frow"><span class="fc">${esc(c)}</span><div class="fparts">${formulaHTML(f)}</div></div>`).join("")}</div></section>
    <section class="sec" id="s-eg"><h2><span class="n">4</span>Ví dụ phân tích từ loại</h2>
      <p style="color:var(--muted);margin:-4px 0 12px">Bấm vào từng từ để xem giải thích. Gạch chân đậm = chủ ngữ, khung nét đứt = túc từ.</p>
      ${legendHTML()}<div class="eg">${L.eg.map(([s,vi])=>{const h=sentence(s);return `<div class="egi">${h}<div class="tr">${sayBtn(plainText(parse(s)))}<span>${esc(vi)}</span></div></div>`;}).join("")}</div></section>
    <section class="sec" id="s-note"><h2><span class="n">5</span>Lưu ý và lỗi thường gặp</h2>${L.note.map(t=>`<div class="note">${inline(t)}</div>`).join("")}</section>
    <section class="sec" id="s-q"><h2><span class="n">6</span>Bài tập</h2><div class="qs" id="qs"></div><div id="res"></div></section>
    <div class="navrow">${prev?`<button class="btn ghost" data-go="${prev.id}">← ${esc(prev.t)}</button>`:"<span></span>"}${next?`<button class="btn" data-go="${next.id}">${esc(next.t)} →</button>`:""}</div>
  </article>
  <aside class="toc"><div class="box"><h4>Trong bài này</h4><a href="#s-pic">Hình minh họa</a><a href="#s-ex">Giải thích</a><a href="#s-f">Công thức</a><a href="#s-eg">Ví dụ</a><a href="#s-note">Lưu ý</a><a href="#s-q">Bài tập</a></div>
  <div class="box"><h4>Bảng màu từ loại</h4>${legendHTML()}</div></aside></div>`;
  $("#back").onclick=()=>go("lessons");
  $$("[data-go]").forEach(b=>b.onclick=()=>go("lesson",{lesson:b.dataset.go}));
  $$(".toc a").forEach(a=>a.onclick=e=>{e.preventDefault();const t=$(a.getAttribute("href"));t&&t.scrollIntoView({behavior:"smooth",block:"start"});});
  // exercises: lesson questions + generated part-of-speech checks from this lesson's examples
  const qs=L.q.slice();
  for(let k=0;k<3;k++){const g=genPos(egStr);if(g)qs.push(g);}
  const o=genObj(egStr);qs.push(o||genPos(egStr));
  let answered=0,correct=0;const box=$("#qs");
  qs.forEach((q,i)=>box.appendChild(mountQ(q,i+1,ok=>{answered++;if(ok)correct++;if(answered===qs.length)showResult();})));
  function showResult(){
    const pct=Math.round(correct/qs.length*100);
    const prevBest=store.lessons[L.id]?store.lessons[L.id].best:0;
    store.lessons[L.id]={best:Math.max(pct,prevBest)};save();
    $("#res").innerHTML=`<div class="result"><b>${correct}/${qs.length}</b><div><div style="font-weight:800">${pct>=90?"Xuất sắc!":pct>=70?"Làm tốt lắm!":pct>=50?"Khá rồi, cố thêm chút nữa!":"Đọc lại phần giải thích rồi thử lại nhé!"}</div><div style="color:var(--muted);font-size:14px">Điểm cao nhất của bài: ${Math.max(pct,prevBest)}%</div></div><button class="btn ghost" id="redo">Làm lại bài tập</button></div>`;
    $("#redo").onclick=()=>{go("lesson",{lesson:L.id});setTimeout(()=>{const t=$("#s-q");t&&t.scrollIntoView();},30);};
  }
}

function viewVocab(){
  const total=VOCAB.reduce((a,c)=>a+c.w.length,0);
  app.innerHTML=`<div class="view-head"><div><div class="eyebrow">Cambridge Movers</div><h1>Từ vựng theo chủ đề</h1>
  <p>${total} từ trong ${VOCAB.length} chủ đề. Màu của từ cho biết từ loại: <span class="ic k-N">danh từ</span> <span class="ic k-V">động từ</span> <span class="ic k-A">tính từ</span> <span class="ic k-Adv">trạng từ</span> <span class="ic k-P">giới từ</span>. Bấm loa để nghe phát âm.</p></div>
  <button class="btn" id="vq">Luyện từ vựng đang xem</button></div>
  <div class="chips" id="vcats" style="margin-bottom:10px"><button class="chip" data-c="all">Tất cả</button>${VOCAB.map(c=>`<button class="chip" data-c="${c.id}">${c.em} ${c.name}</button>`).join("")}</div>
  <div class="vtools"><div class="chips" id="vpos">${[["all","Mọi từ loại"],["n","Danh từ"],["v","Động từ"],["adj","Tính từ"],["adv","Trạng từ"],["prep","Giới từ"]].map(([k,t])=>`<button class="chip" data-p="${k}">${t}</button>`).join("")}</div>
  <input class="search" id="vsearch" type="search" placeholder="Tìm từ tiếng Anh hoặc nghĩa…" aria-label="Tìm từ" value="${esc(vState.q)}"></div>
  <div class="vgrid" id="vgrid"></div>`;
  const draw=()=>{
    $$("#vcats .chip").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.c===vState.cat)));
    $$("#vpos .chip").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.p===vState.pos)));
    const list=filteredVocab();
    $("#vgrid").innerHTML=list.length?list.map(([w,p,vi,em,ex])=>{const k=VPOS[p];return `<div class="vcard k-${k}"><div class="row"><span class="em" aria-hidden="true">${em}</span><span class="pos">${POS[k].vi}</span></div>
      <div class="row"><span class="w">${esc(w)}</span>${sayBtn(w)}</div><div class="m">${esc(vi)}</div><div class="x">${esc(ex)}</div></div>`;}).join(""):`<div class="empty">Không có từ nào khớp. Thử bỏ bớt bộ lọc.</div>`;
  };
  draw();
  $$("#vcats .chip").forEach(b=>b.onclick=()=>{vState.cat=b.dataset.c;draw();});
  $$("#vpos .chip").forEach(b=>b.onclick=()=>{vState.pos=b.dataset.p;draw();});
  $("#vsearch").oninput=e=>{vState.q=e.target.value;draw();};
  $("#vq").onclick=()=>{const l=filteredVocab();if(l.length<4){$("#vq").textContent="Cần ít nhất 4 từ để luyện";return;}go("practice",{run:{mode:"vmix",pool:l}});};
}
function filteredVocab(){
  const q=norm(vState.q);
  return VOCAB.filter(c=>vState.cat==="all"||c.id===vState.cat).flatMap(c=>c.w)
    .filter(w=>vState.pos==="all"||w[1]===vState.pos).filter(w=>!q||norm(w[0]).includes(q)||norm(w[2]).includes(q));
}

// ---------- practice ----------
const ALLV=()=>VOCAB.flatMap(c=>c.w);
const MODES=[
 {id:"pos",em:"🎨",name:"Đoán từ loại",desc:"Một từ trong câu được tô đậm. Em chọn đó là danh từ, động từ, tính từ…"},
 {id:"obj",em:"🎯",name:"Tìm túc từ",desc:"Bấm vào túc từ (người/vật nhận hành động) trong mỗi câu."},
 {id:"g1",em:"🌱",name:"Ngữ pháp cơ bản",desc:"10 câu ngẫu nhiên từ 18 bài cơ bản."},
 {id:"g2",em:"🌿",name:"Ngữ pháp trung cấp",desc:"10 câu ngẫu nhiên từ các bài trung cấp."},
 {id:"g3",em:"🌳",name:"Ngữ pháp nâng cao",desc:"10 câu ngẫu nhiên từ các bài nâng cao."},
 {id:"vpic",em:"🖼️",name:"Nhìn hình chọn từ",desc:"Xem hình và nghĩa, chọn từ tiếng Anh đúng (Movers)."},
 {id:"vspell",em:"✏️",name:"Viết chính tả",desc:"Xem hình và nghĩa tiếng Việt, gõ từ tiếng Anh."},
 {id:"vmean",em:"🔤",name:"Chọn nghĩa đúng",desc:"Đọc từ tiếng Anh, chọn nghĩa tiếng Việt."},
 {id:"vpos",em:"🏷️",name:"Từ này là từ loại gì?",desc:"Xem từ Movers và câu ví dụ, cho biết nó là danh từ, động từ hay tính từ…"}
];
function makeQ(mode,pool){
  const V=pool||ALLV();
  if(mode==="pos") return genPos(allTagged());
  if(mode==="obj") return genObj(allTagged());
  if(mode[0]==="g"){const lv=+mode[1];const L=pick(LESSONS.filter(l=>l.lv===lv));const q=Object.assign({},pick(L.q));q.kind=L.vi;return q;}
  if(mode==="vmix") return makeQ(pick(["vpic","vspell","vmean","vpos"]),V);
  const w=pick(V);
  const others=n=>shuffle(ALLV().filter(x=>x[0]!==w[0]&&x[3]!==w[3]&&x[2]!==w[2])).slice(0,n);
  const pic=`<div class="bigem" aria-hidden="true">${w[3]}</div>`;
  if(mode==="vpic"){const o=shuffle([w].concat(others(3)));return {t:"mc",kind:"Nhìn hình chọn từ",q:`Từ nào có nghĩa là <b>“${esc(w[2])}”</b>?`,pre:pic,o:o.map(x=>esc(x[0])),a:o.indexOf(w),e:`<b>${esc(w[0])}</b> – ${esc(w[2])} (${POS[VPOS[w[1]]].vi}). Ví dụ: <i>${esc(w[4])}</i>`};}
  if(mode==="vspell") return {t:"f",kind:"Viết chính tả",q:`Viết từ tiếng Anh có nghĩa <b>“${esc(w[2])}”</b> (${w[0].length} chữ cái${w[0].includes(" ")?", có dấu cách":""}, bắt đầu bằng “${esc(w[0][0])}”):`,pre:pic,a:[w[0]],e:`Ví dụ: <i>${esc(w[4])}</i>`};
  if(mode==="vmean"){const o=shuffle([w].concat(others(3)));return {t:"mc",kind:"Chọn nghĩa đúng",q:`<b style="font-size:24px">${esc(w[0])}</b> ${sayBtn(w[0])} nghĩa là gì?`,o:o.map(x=>esc(x[2])),a:o.indexOf(w),e:`<i>${esc(w[4])}</i>`};}
  if(mode==="vpos"){const ks=["n","v","adj","adv","prep"];return {t:"mc",kind:"Từ loại của từ vựng",q:`Từ <b>“${esc(w[0])}”</b> (${esc(w[2])}) là từ loại gì?`,pre:`<p style="margin:0 0 10px;color:var(--muted)">Ví dụ: <i>${esc(w[4])}</i></p>`,o:ks.map(k=>POS[VPOS[k]].vi),a:ks.indexOf(w[1]),e:POS[VPOS[w[1]]].desc};}
}
function viewPractice(){
  if(state.run){runQuiz(state.run);return;}
  app.innerHTML=`<div class="view-head"><div><div class="eyebrow">Luyện tập không giới hạn</div><h1>Chọn một kiểu luyện tập</h1>
  <p>Mỗi lượt gồm 10 câu được chọn ngẫu nhiên, nên em có thể làm lại bao nhiêu lần cũng được và lần nào cũng gặp câu mới.</p></div></div>
  <div class="lvl"><h2>Từ loại và túc từ</h2></div><div class="pmodes" id="m1"></div>
  <div class="lvl"><h2>Ngữ pháp</h2></div><div class="pmodes" id="m2"></div>
  <div class="lvl"><h2>Từ vựng Movers</h2></div><div class="pmodes" id="m3"></div>`;
  const card=m=>{const b=store.practice[m.id];return `<button class="pm" data-m="${m.id}"><span class="em" aria-hidden="true">${m.em}</span><b>${m.name}</b><span>${m.desc}</span>${b!=null?`<span class="best">Điểm cao nhất: ${b}/10</span>`:""}</button>`;};
  $("#m1").innerHTML=MODES.slice(0,2).map(card).join("");$("#m2").innerHTML=MODES.slice(2,5).map(card).join("");$("#m3").innerHTML=MODES.slice(5).map(card).join("");
  $$(".pm").forEach(b=>b.onclick=()=>go("practice",{run:{mode:b.dataset.m}}));
}
function runQuiz(run){
  const N=10;let i=0,score=0;const mode=MODES.find(m=>m.id===run.mode)||{name:"Luyện từ vựng",id:run.mode};
  app.innerHTML=`<div class="runner"><button class="back" id="back">← Các kiểu luyện tập</button>
  <div class="rhead"><h1 style="font-size:28px">${mode.name}</h1><span id="cnt" style="font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums"></span></div>
  <div class="bar" style="margin-bottom:16px"><i id="pbar" style="width:0"></i></div><div id="stage"></div></div>`;
  $("#back").onclick=()=>{state.run=null;go("practice");};
  const stage=$("#stage");
  const nextQ=()=>{
    if(i>=N){const prevB=store.practice[run.mode];if(mode.id&&MODES.find(m=>m.id===run.mode)){store.practice[run.mode]=Math.max(score,prevB||0);save();}
      stage.innerHTML=`<div class="result" style="flex-direction:column;align-items:flex-start"><b>${score}/${N}</b><div style="font-weight:800">${score>=9?"Xuất sắc!":score>=7?"Rất tốt!":score>=5?"Khá lắm, luyện thêm nhé!":"Cố lên, thử lại một lượt nữa!"}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="again">Làm lượt mới</button><button class="btn ghost" id="out">Chọn kiểu khác</button></div></div>`;
      $("#again").onclick=()=>go("practice",{run});$("#out").onclick=()=>{state.run=null;go("practice");};return;}
    $("#cnt").textContent=`Câu ${i+1}/${N} · Đúng ${score}`;$("#pbar").style.width=(i/N*100)+"%";
    SENTS.length=0;stage.innerHTML="";
    const q=makeQ(run.mode,run.pool);
    const el=mountQ(q,i+1,ok=>{if(ok)score++;i++;$("#cnt").textContent=`Câu ${i}/${N} · Đúng ${score}`;
      const nb=document.createElement("div");nb.style.cssText="margin-top:12px;display:flex;justify-content:flex-end";
      nb.innerHTML=`<button class="btn">${i>=N?"Xem kết quả":"Câu tiếp theo →"}</button>`;el.appendChild(nb);const b=$("button",nb);b.onclick=nextQ;b.focus({preventScroll:true});});
    stage.appendChild(el);const inp=$("input",el);if(inp)inp.focus({preventScroll:true});
  };
  nextQ();
}

render();

</script>
