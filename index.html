<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Vở Ngữ Pháp Tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: grid-paper notebook ("vở ô li"), purple school ink as accent, colored pencils = parts of speech.
   Sticky tab bar, then one working view at a time (lesson list / lesson / parts of speech / vocab / practice). */
:root{
  --paper:#f6f7fb; --grid:rgba(91,63,168,.075); --card:#ffffff; --ink:#26203a; --muted:#69637f; --line:#e2dfec;
  --accent:#5b3fa8; --accent-ink:#ffffff; --accent-soft:#ebe5f8;
  --good:#16804a; --good-soft:#e2f4ea; --bad:#c42b2b; --bad-soft:#fbe6e6;
  --n:#1d63c9; --v:#cf3030; --a:#17844a; --adv:#b86200; --pr:#b02d82; --p:#0b7a82; --d:#5d6a7d; --aux:#93305a; --c:#86572a; --q:#4a43c4;
  --display:"Baloo 2","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(38,32,58,.06),0 6px 18px rgba(38,32,58,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16131e; --grid:rgba(185,162,255,.06); --card:#211c2c; --ink:#ece8f6; --muted:#a8a1bf; --line:#352e47;
  --accent:#b9a2ff; --accent-ink:#1a1426; --accent-soft:#2d2542;
  --good:#4fd18a; --good-soft:#163526; --bad:#ff7d7d; --bad-soft:#3d1c20;
  --n:#6eaaff; --v:#ff7b7b; --a:#52d38c; --adv:#ffb44d; --pr:#f27fc8; --p:#41d0d6; --d:#a9b3c4; --aux:#f08cab; --c:#d7a678; --q:#a29eff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16131e; --grid:rgba(185,162,255,.06); --card:#211c2c; --ink:#ece8f6; --muted:#a8a1bf; --line:#352e47;
  --accent:#b9a2ff; --accent-ink:#1a1426; --accent-soft:#2d2542;
  --good:#4fd18a; --good-soft:#163526; --bad:#ff7d7d; --bad-soft:#3d1c20;
  --n:#6eaaff; --v:#ff7b7b; --a:#52d38c; --adv:#ffb44d; --pr:#f27fc8; --p:#41d0d6; --d:#a9b3c4; --aux:#f08cab; --c:#d7a678; --q:#a29eff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:20px;flex:none}
.brand b{font-family:var(--display);font-size:20px;font-weight:800;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12.5px;display:block}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 13px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted);font-size:15px}
.tab:hover{color:var(--ink);background:var(--accent-soft)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:17px;height:17px}

main{padding-block:22px 80px}
.view-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between;margin-bottom:18px}
.view-head h1{font-size:clamp(26px,4vw,36px);font-weight:800}
.view-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;
  color:var(--k);background:color-mix(in srgb,var(--k) 11%,transparent)}
.lg i{width:9px;height:9px;border-radius:50%;background:var(--k)}
.lg.role{color:var(--ink);background:var(--card);border:1px solid var(--line)}
.lg.role .sw{width:22px;height:14px;border-radius:4px}
.sw.s{border-bottom:3px solid var(--ink)} .sw.o{border:2px dashed var(--ink)}

/* tokens (colored words) */
.k-N{--k:var(--n)}.k-V{--k:var(--v)}.k-A{--k:var(--a)}.k-Adv{--k:var(--adv)}.k-Pr{--k:var(--pr)}.k-P{--k:var(--p)}
.k-D{--k:var(--d)}.k-Aux{--k:var(--aux)}.k-C{--k:var(--c)}.k-Q{--k:var(--q)}
.sent{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 3px;font-size:19px;line-height:1.35}
.tk{display:inline-flex;flex-direction:column;align-items:center;border:0;padding:2px 6px 3px;border-radius:7px;cursor:pointer;
  color:var(--k);background:color-mix(in srgb,var(--k) 12%,transparent);font-weight:800;font-size:inherit;line-height:1.25}
.tk:hover{background:color-mix(in srgb,var(--k) 22%,transparent)}
.tk.r-S .w{border-bottom:3px solid currentColor;padding-bottom:1px}
.tk.r-O,.tk.r-Oi{outline:2px dashed currentColor;outline-offset:-2px}
.tk .lb{display:none;font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;opacity:.9;margin-top:2px}
.show-labels .tk .lb{display:block}
.tk.sel{box-shadow:0 0 0 3px var(--k)}
.pl{padding:2px 2px 3px;font-weight:600;color:var(--ink)}
.tk.plain{color:var(--ink);background:transparent;font-weight:600}
.tk.plain:hover{background:var(--accent-soft)}
.tk.target{background:var(--accent);color:var(--accent-ink)}
.ic{display:inline;padding:0 5px;border-radius:5px;font-weight:800;color:var(--k);background:color-mix(in srgb,var(--k) 12%,transparent);white-space:nowrap}

/* buttons, chips */
.btn{border:0;cursor:pointer;font-weight:800;padding:9px 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:999px;font-weight:700;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* lesson list */
.lvl{margin:26px 0 12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lvl h2{font-size:24px;font-weight:800}
.lvl span{color:var(--muted);font-size:14px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lcard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;cursor:pointer;
  display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;transition:transform .15s,border-color .15s}
.lcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.lnum{grid-row:span 3;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;
  background:var(--accent-soft);color:var(--accent)}
.lcard.done .lnum{background:var(--good);color:var(--card)}
.lcard h3{font-size:17.5px;font-weight:700}
.lcard .vi{font-size:14px;color:var(--muted);line-height:1.35}
.lcard .meta{font-size:12.5px;color:var(--muted);font-weight:700}
.lcard .meta .sc{color:var(--good)}

.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:120px}
.stat b{font-family:var(--display);font-size:24px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}

/* lesson page */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:start}
@media (max-width:860px){.lesson{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.paper{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,32px);box-shadow:var(--shadow);min-width:0}
.lhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.lhead h1{font-size:clamp(26px,4vw,38px);font-weight:800}
.lhead .vi{color:var(--muted);font-size:17px;font-weight:600;margin-top:2px}
.back{border:0;background:none;color:var(--accent);font-weight:800;cursor:pointer;padding:0;margin-bottom:10px;font-size:15px}
.sec{margin-top:30px}
.sec>h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec>h2 .n{font-size:13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.prose p{margin:0 0 12px;max-width:68ch}
.prose ul{margin:0 0 12px;padding-left:20px;max-width:68ch}
.prose li{margin-bottom:6px}
.formula{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.frow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
@media (max-width:560px){.frow{grid-template-columns:minmax(0,1fr)}}
.frow .fc{font-weight:800;font-size:13.5px;color:var(--muted)}
.fparts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fp{padding:4px 10px;border-radius:8px;font-weight:800;font-size:15px;color:var(--k,var(--ink));background:color-mix(in srgb,var(--k,var(--ink)) 12%,transparent)}
.fp.S{--k:var(--ink);border-bottom:3px solid var(--ink)}
.fp.O{--k:var(--ink);outline:2px dashed var(--ink);outline-offset:-2px}
.fp.X{background:transparent;color:var(--muted);padding:4px 2px}
.plus{color:var(--muted);font-weight:800}
.eg{display:flex;flex-direction:column;gap:12px}
.egi{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper)}
.egi .tr{margin-top:6px;color:var(--muted);font-size:15px;display:flex;gap:8px;align-items:center}
.say{border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;width:30px;height:28px;display:inline-grid;place-items:center;flex:none;padding:0}
.say:hover{border-color:var(--accent)}
.say svg{width:16px;height:16px;fill:var(--accent)}
.note{padding:12px 14px;border-radius:12px;background:var(--accent-soft);margin-bottom:10px;max-width:72ch}
.note b:first-child{color:var(--accent)}
.toc{position:sticky;top:90px;display:flex;flex-direction:column;gap:14px}
.toc .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.toc h4{font-size:15px;margin-bottom:8px}
.toc a{display:block;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;padding:3px 0}
.toc a:hover{color:var(--accent)}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px}

/* pictures */
.pic{margin:4px 0 6px;padding:16px;border-radius:14px;background:var(--paper);border:1px solid var(--line);overflow-x:auto}
.pic+.pic{margin-top:10px}
.pic .cap{font-size:14px;color:var(--muted);margin-top:10px;text-align:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;min-width:0}
.pcell .em{font-size:38px;line-height:1.2;letter-spacing:2px}
.pcell .t{font-weight:800;font-size:15px;line-height:1.3;margin-top:4px}
.pcell .s{font-size:12.5px;color:var(--muted);line-height:1.3}
.flow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.fbox{background:var(--card);border-radius:14px;padding:10px 14px;text-align:center;min-width:96px;border:1px solid var(--line)}
.fbox .em{font-size:44px;line-height:1.1}
.fbox .t{font-weight:800}
.fbox .r{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fbox.S{border-bottom:4px solid var(--ink)} .fbox.O{border:2px dashed var(--ink)}
.farrow{display:flex;flex-direction:column;align-items:center;color:var(--v);font-weight:800}
.farrow .line{width:70px;height:3px;background:var(--v);position:relative;margin:4px 0}
.farrow .line::after{content:"";position:absolute;right:-2px;top:-6px;border-left:11px solid var(--v);border-top:7.5px solid transparent;border-bottom:7.5px solid transparent}
.farrow .r{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp{display:flex;align-items:flex-end;justify-content:center;gap:clamp(12px,5vw,40px);flex-wrap:wrap}
.cmp div{text-align:center;font-weight:800}
.cmp small{display:block;color:var(--muted);font-weight:700}
.freq{display:flex;flex-direction:column;gap:7px;max-width:520px;margin:0 auto}
.fq{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-weight:800;font-size:14.5px}
.fq .tb{height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.fq .tb i{display:block;height:100%;background:var(--adv)}
.fq span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
svg.tl{width:100%;min-width:460px;height:auto;display:block}
.tl .ax{stroke:var(--muted);stroke-width:2}
.tl .tick{stroke:var(--muted);stroke-width:2}
.tl text{fill:var(--muted);font-family:var(--body);font-weight:700;font-size:13px}
.tl text.now{fill:var(--accent);font-weight:800}
.tl .mk{fill:var(--accent);stroke:none}
.tl .wv{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round}
.tl .ar{stroke:var(--v);stroke-width:4;fill:none;stroke-linecap:round}
.tl .arh{fill:var(--v)}
.tl .bolt{fill:var(--adv)}
.tl .ds{stroke:var(--accent);stroke-width:3;stroke-dasharray:6 6;fill:none}
.prepg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.prepg figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 6px 8px;text-align:center}
.prepg svg{width:100%;height:auto;display:block}
.prepg figcaption{font-weight:800;color:var(--p)}
.prepg .bx{fill:color-mix(in srgb,var(--n) 22%,var(--card));stroke:var(--n);stroke-width:2.5}
.prepg .ball{fill:var(--v)}
.prepg .gd{stroke:var(--line);stroke-width:2}

/* exercises */
.qs{display:flex;flex-direction:column;gap:14px}
.q{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card)}
.q .qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.q .qn{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px}
.q.ok .qn{background:var(--good);color:var(--card)} .q.no .qn{background:var(--bad);color:var(--card)}
.q .qt{font-weight:700;font-size:16.5px;min-width:0}
.q .kind{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.fill{display:flex;gap:8px;flex-wrap:wrap}
.fill input{flex:1 1 200px;min-width:0;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:700}
.fill input:focus{border-color:var(--accent);outline:none}
.fill input.right{border-color:var(--good)} .fill input.wrong{border-color:var(--bad)}
.ord{min-height:46px;border:2px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.ord:empty::before{content:"Bấm vào các từ bên dưới để xếp câu…";color:var(--muted);font-size:14px;padding:4px}
.wb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.wbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 11px;font-weight:800;cursor:pointer}
.wbtn:hover{border-color:var(--accent)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b.h{display:block}
.fb.ok b.h{color:var(--good)} .fb.no b.h{color:var(--bad)}
.result{margin-top:16px;padding:16px;border-radius:14px;background:var(--accent-soft);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.result b{font-family:var(--display);font-size:28px}

/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.vcard .em{font-size:44px;line-height:1.15}
.vcard .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vcard .w{font-family:var(--display);font-size:22px;font-weight:800;color:var(--k);line-height:1.1}
.vcard .pos{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px;color:var(--k);background:color-mix(in srgb,var(--k) 12%,transparent);white-space:nowrap;align-self:flex-start}
.vcard .m{font-weight:700}
.vcard .x{font-size:14px;color:var(--muted);line-height:1.4}
.vtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.search{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;min-width:0;width:240px;max-width:100%}

/* parts of speech guide */
.posgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.posc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.posc h3{font-size:22px;color:var(--k);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.posc h3 small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:700}
.posc p{margin:6px 0}
.posc .lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px;display:block}
.posc .sent{font-size:16.5px;margin-top:4px}

<script>
// Cú pháp ví dụ: word/TAG  (TAG = Từ loại[.Vai trò]); dấu _ nối cụm từ. [[word/TAG]] dùng trong đoạn giải thích.
// Từ loại: N V A Adv Pr P D Aux C Q · Vai trò: S (chủ ngữ), O (túc từ), Oi (túc từ gián tiếp)
const LESSONS = [];
LESSONS.push(
{id:"b1",lv:1,t:"Parts of Speech",vi:"Từ loại và vai trò của từ trong câu",
pic:{type:"svo",s:["👧","She"],v:"eats",o:["🍎","an apple"],cap:"Cô bé (chủ ngữ) → ăn (động từ) → quả táo (túc từ)"},
ex:[
"Mỗi từ trong câu tiếng Anh đều thuộc một <b>từ loại</b> (part of speech). Biết từ loại giúp em đặt từ đúng chỗ, chia động từ đúng và hiểu câu nhanh hơn. Trong ứng dụng này, mỗi từ loại có <b>một màu riêng</b>, giống như tô bút chì màu vào vở.",
"<b>Danh từ (Noun)</b> – tên gọi của người, con vật, đồ vật, nơi chốn: [[cat/N]], [[teacher/N]], [[school/N]], [[water/N]]. Câu hỏi giúp nhận ra: <i>“Ai? Cái gì? Con gì? Ở đâu?”</i>",
"<b>Động từ (Verb)</b> – chỉ hành động hoặc trạng thái: [[run/V]], [[eat/V]], [[sleep/V]], [[like/V]], [[is/V]]. Câu hỏi: <i>“Làm gì? Thế nào (trạng thái)?”</i>. Câu tiếng Anh nào cũng phải có động từ.",
"<b>Tính từ (Adjective)</b> – miêu tả đặc điểm của danh từ (to, nhỏ, màu sắc, cảm xúc…): [[big/A]], [[red/A]], [[happy/A]], [[tall/A]]. Câu hỏi: <i>“Như thế nào?”</i>. Tính từ đứng <b>trước danh từ</b> ([[a/D]] [[red/A]] [[ball/N]]) hoặc <b>sau động từ to be</b> ([[The_ball/N]] [[is/V]] [[red/A]]).",
"<b>Trạng từ (Adverb)</b> – bổ nghĩa cho động từ: làm <i>như thế nào</i>, <i>bao lâu một lần</i>: [[quickly/Adv]], [[slowly/Adv]], [[well/Adv]], [[always/Adv]]. Nhiều trạng từ có đuôi <b>-ly</b>.",
"<b>Đại từ (Pronoun)</b> – dùng thay cho danh từ để khỏi lặp lại: [[I/Pr]], [[she/Pr]], [[they/Pr]], [[him/Pr]], [[us/Pr]].  <b>Giới từ (Preposition)</b> – chỉ vị trí, thời gian: [[in/P]], [[on/P]], [[under/P]], [[at/P]]. <b>Từ hạn định (Determiner)</b> – đứng trước danh từ: [[a/D]], [[an/D]], [[the/D]], [[my/D]], [[this/D]].",
"Ngoài từ loại, mỗi từ còn có <b>vai trò</b> trong câu. <b>Chủ ngữ (Subject)</b> là người/vật <i>làm</i> hành động, thường đứng đầu câu (gạch chân đậm). <b>Túc từ (Object)</b> – còn gọi là <b>tân ngữ</b> – là người/vật <i>nhận</i> hành động, đứng <b>sau động từ</b> (khung nét đứt). Ví dụ: [[Tom/N.S]] [[kicks/V]] [[the_ball/N.O]] → Tom là chủ ngữ, the ball là túc từ."],
f:[["Câu cơ bản","S:Chủ ngữ + V:Động từ + O:Túc từ"],["Có tính từ","S:Chủ ngữ + V:Động từ + D:a/the + A:Tính từ + N:Danh từ"],["Có trạng từ","S:Chủ ngữ + V:Động từ + Adv:Trạng từ"]],
eg:[
["The/D little/A cat/N.S drinks/V milk/N.O.","Con mèo nhỏ uống sữa."],
["She/Pr.S reads/V a/D funny/A book/N.O.","Cô ấy đọc một cuốn sách vui nhộn."],
["My/D brother/N.S plays/V football/N.O every_day/Adv.","Anh trai tôi chơi bóng đá mỗi ngày."],
["The/D dog/N.S runs/V quickly/Adv.","Con chó chạy nhanh."],
["Birds/N.S fly/V in/P the/D blue/A sky/N.","Chim bay trên bầu trời xanh."],
["We/Pr.S love/V our/D kind/A teacher/N.O.","Chúng em yêu cô giáo hiền hậu của mình."],
["The/D baby/N.S is/V very/Adv happy/A.","Em bé rất vui."]],
note:["<b>Mẹo nhận biết:</b> tìm <b>động từ</b> trước tiên. Từ đứng trước động từ (làm hành động) là <b>chủ ngữ</b>; từ đứng sau động từ (nhận hành động) là <b>túc từ</b>.","<b>Một từ có thể có nhiều từ loại:</b> [[drink/V]] (uống) là động từ, nhưng [[a_drink/N]] (một đồ uống) là danh từ. Hãy nhìn vị trí của từ trong câu!","<b>Túc từ không nhất thiết là danh từ:</b> đại từ cũng làm túc từ được, ví dụ: [[I/Pr.S]] [[like/V]] [[him/Pr.O]]."],
q:[
{t:"mc",q:"Từ nào là <b>danh từ</b>?",o:["run","happy","table","slowly"],a:2,e:"<b>table</b> (cái bàn) là tên một đồ vật → danh từ. run = động từ, happy = tính từ, slowly = trạng từ."},
{t:"mc",q:"Từ nào là <b>động từ</b>?",o:["jump","green","pencil","under"],a:0,e:"<b>jump</b> (nhảy) chỉ hành động → động từ."},
{t:"mc",q:"Từ nào là <b>tính từ</b>?",o:["sing","tall","quickly","school"],a:1,e:"<b>tall</b> (cao) miêu tả đặc điểm → tính từ."},
{t:"mc",q:"Từ nào là <b>trạng từ</b>?",o:["beautiful","beauty","beautifully","beautify"],a:2,e:"<b>beautifully</b> có đuôi -ly, bổ nghĩa cho động từ (hát hay, vẽ đẹp) → trạng từ."},
{t:"mc",q:"Trong câu “Mary eats a banana.”, <b>túc từ</b> là:",o:["Mary","eats","a banana"],a:2,e:"<b>a banana</b> đứng sau động từ eats và nhận hành động “ăn” → túc từ."},
{t:"mc",q:"Trong câu “The children sing a song.”, <b>chủ ngữ</b> là:",o:["The children","sing","a song"],a:0,e:"<b>The children</b> đứng trước động từ và là người thực hiện hành động hát → chủ ngữ."},
{t:"mc",q:"Câu nào đặt tính từ <b>đúng vị trí</b>?",o:["I have a dog big.","I have a big dog.","I have big a dog."],a:1,e:"Tính từ đứng <b>trước danh từ</b> và sau a/an/the: a <b>big</b> dog."},
{t:"o",a:"The cat sleeps on the sofa.",e:"Chủ ngữ (The cat) + động từ (sleeps) + giới từ (on) + danh từ (the sofa)."}]},

{id:"b2",lv:1,t:"Singular & Plural Nouns",vi:"Danh từ số ít và số nhiều",
pic:{type:"grid",items:[["🐱","a cat","1 con mèo"],["🐱🐱🐱","three cats","+ s"],["🦊","a fox","1 con cáo"],["🦊🦊","two foxes","+ es"],["🧒","a child","1 đứa trẻ"],["🧒🧒","children","bất quy tắc"],["🦷","a tooth","1 cái răng"],["🦷🦷","teeth","bất quy tắc"]]},
ex:[
"<b>Danh từ số ít</b> (singular) chỉ <b>một</b> người/vật, thường có [[a/D]] hoặc [[an/D]] đứng trước: [[a_dog/N]], [[an_egg/N]]. <b>Danh từ số nhiều</b> (plural) chỉ <b>hai trở lên</b>: [[two_dogs/N]], [[eggs/N]].",
"<b>Quy tắc 1 – thêm -s</b> (đa số danh từ): book → books, cat → cats, pen → pens, girl → girls.",
"<b>Quy tắc 2 – thêm -es</b> khi danh từ tận cùng bằng <b>-s, -ss, -sh, -ch, -x, -o</b>: bus → buses, glass → glasses, dish → dishes, watch → watches, box → boxes, tomato → tomatoes, potato → potatoes. (Ngoại lệ: photo → photos, piano → pianos.)",
"<b>Quy tắc 3 – phụ âm + y → bỏ y, thêm -ies</b>: baby → babies, city → cities, party → parties, butterfly → butterflies. Nhưng <b>nguyên âm + y</b> thì chỉ thêm s: boy → boys, day → days, key → keys.",
"<b>Quy tắc 4 – -f/-fe → -ves</b>: leaf → leaves, knife → knives, wolf → wolves, shelf → shelves.",
"<b>Danh từ bất quy tắc</b> (phải học thuộc): man → <b>men</b>, woman → <b>women</b>, child → <b>children</b>, person → <b>people</b>, foot → <b>feet</b>, tooth → <b>teeth</b>, mouse → <b>mice</b>, goose → <b>geese</b>. Một số từ giữ nguyên: fish → fish, sheep → sheep.",
"<b>Chú ý chia động từ:</b> chủ ngữ số ít đi với [[is/V]], số nhiều đi với [[are/V]]: [[The_mouse/N.S]] [[is/V]] [[small/A]]. → [[The_mice/N.S]] [[are/V]] [[small/A]]."],
f:[["Số ít","D:a / an + N:Danh từ"],["Số nhiều","D:two, three, many… + N:Danh từ + X:-s / -es / -ies / -ves"]],
eg:[
["I/Pr.S have/V two/D brothers/N.O.","Tôi có hai anh trai."],
["There_are/V three/D boxes/N.S on/P the/D table/N.","Có ba cái hộp trên bàn."],
["The/D babies/N.S are/V sleeping/V.","Những em bé đang ngủ."],
["Those/D women/N.S are/V teachers/N.","Những người phụ nữ kia là giáo viên."],
["My/D feet/N.S are/V cold/A.","Chân tôi bị lạnh."],
["The/D cat/N.S catches/V two/D mice/N.O.","Con mèo bắt được hai con chuột."],
["Autumn/N.S leaves/N.S are/V yellow/A.","Lá mùa thu màu vàng."]],
note:["<b>Lỗi thường gặp:</b> ❌ two child → ✅ two <b>children</b>; ❌ three tooths → ✅ three <b>teeth</b>; ❌ many peoples → ✅ many <b>people</b>.","<b>Cách đọc đuôi -es</b> sau s, x, sh, ch là /ɪz/: boxes /ˈbɒksɪz/, watches /ˈwɒtʃɪz/."],
q:[
{t:"f",q:"one box → two ___",a:["boxes"],e:"box tận cùng bằng -x → thêm <b>-es</b>: boxes."},
{t:"f",q:"one baby → three ___",a:["babies"],e:"Phụ âm + y → bỏ y thêm <b>-ies</b>: babies."},
{t:"f",q:"one child → many ___",a:["children"],e:"child là danh từ bất quy tắc → <b>children</b>."},
{t:"mc",q:"one tooth → two ___",o:["tooths","teeth","teeths"],a:1,e:"tooth → <b>teeth</b> (bất quy tắc)."},
{t:"mc",q:"one leaf → many ___",o:["leafs","leaves","leafes"],a:1,e:"-f → <b>-ves</b>: leaves."},
{t:"mc",q:"one boy → two ___",o:["boies","boys","boyes"],a:1,e:"Nguyên âm (o) + y → chỉ thêm s: <b>boys</b>."},
{t:"mc",q:"The mice ___ in the kitchen.",o:["is","are"],a:1,e:"mice là số nhiều → dùng <b>are</b>."},
{t:"f",q:"one mouse → two ___",a:["mice"],e:"mouse → <b>mice</b>."},
{t:"f",q:"one bus → three ___",a:["buses"],e:"bus tận cùng bằng -s → thêm <b>-es</b>."}]},

{id:"b3",lv:1,t:"Articles: a, an, the",vi:"Mạo từ a, an, the",
pic:{type:"grid",items:[["🍌","a banana","phụ âm /b/"],["🍎","an apple","nguyên âm /æ/"],["🥚","an egg","nguyên âm /e/"],["☂️","an umbrella","nguyên âm /ʌ/"],["☀️","the sun","chỉ có một"],["🐶","a dog → the dog","lần 2 nhắc lại"]]},
ex:[
"<b>Mạo từ</b> (article) là một loại <b>từ hạn định</b>, luôn đứng <b>trước danh từ</b>. Có hai loại: mạo từ không xác định [[a/D]], [[an/D]] và mạo từ xác định [[the/D]].",
"<b>a / an</b> = “một”, dùng với <b>danh từ đếm được số ít</b> khi nhắc đến lần đầu hoặc nói chung chung. Dùng [[an/D]] trước từ bắt đầu bằng <b>âm</b> nguyên âm (a, e, i, o, u): an apple, an egg, an ice cream, an orange, an umbrella. Dùng [[a/D]] trước âm phụ âm: a banana, a cat, a pen.",
"Quan trọng là <b>âm</b>, không phải chữ cái: <b>an hour</b> (h câm, đọc /aʊə/), <b>a uniform</b> (u đọc /juː/ là phụ âm), <b>a university</b>.",
"<b>the</b> = “cái/con… đó”, dùng khi người nghe <b>đã biết</b> mình nói đến vật nào: khi nhắc lại lần hai, khi vật là <b>duy nhất</b> (the sun, the moon, the sky, the sea), hoặc khi đã rõ (Close <b>the</b> door = cái cửa ở đây). <b>the</b> dùng được cả số ít, số nhiều và danh từ không đếm được.",
"<b>Không dùng mạo từ</b> trước: tên người (Tom), môn thể thao (play football), bữa ăn (have breakfast), môn học (I like English), và danh từ số nhiều nói chung (I like cats)."],
f:[["a + phụ âm","D:a + N:cat, book, pen, uniform"],["an + nguyên âm","D:an + N:apple, egg, ice cream, orange, hour"],["the","D:the + N:vật đã biết / duy nhất"]],
eg:[
["I/Pr.S have/V a/D cat/N.O and/C a/D dog/N.O.","Tôi có một con mèo và một con chó."],
["The/D cat/N.S is/V black/A.","Con mèo (đó) màu đen."],
["She/Pr.S eats/V an/D orange/N.O every_morning/Adv.","Cô ấy ăn một quả cam mỗi sáng."],
["The/D sun/N.S is/V hot/A.","Mặt trời nóng."],
["He/Pr.S is/V an/D honest/A boy/N.","Cậu ấy là một cậu bé trung thực."],
["Please/Adv open/V the/D window/N.O.","Làm ơn mở cửa sổ ra."],
["We/Pr.S play/V football/N.O after/P school/N.","Chúng tôi chơi bóng đá sau giờ học."]],
note:["<b>Lỗi thường gặp:</b> ❌ a apple → ✅ <b>an</b> apple; ❌ a egg → ✅ <b>an</b> egg; ❌ I play the football → ✅ I play football.","Khi có tính từ, a/an phụ thuộc vào <b>từ ngay sau nó</b>: <b>an</b> egg → <b>a</b> big egg; <b>a</b> cat → <b>an</b> old cat."],
q:[
{t:"mc",q:"I want ___ ice cream.",o:["a","an","the"],a:1,e:"ice bắt đầu bằng âm nguyên âm /aɪ/ → <b>an</b>."},
{t:"mc",q:"___ moon is very bright tonight.",o:["A","An","The"],a:2,e:"Mặt trăng là duy nhất → <b>The</b>."},
{t:"mc",q:"He is ___ doctor.",o:["a","an","the"],a:0,e:"doctor bắt đầu bằng phụ âm /d/ → <b>a</b>."},
{t:"mc",q:"Wait for me. I'll be back in ___ hour.",o:["a","an","the"],a:1,e:"Chữ h trong hour là âm câm → âm đầu là nguyên âm /aʊ/ → <b>an</b>."},
{t:"mc",q:"She has ___ old bike.",o:["a","an"],a:1,e:"Từ ngay sau là old (âm /əʊ/) → <b>an</b>."},
{t:"mc",q:"I saw a bird. ___ bird was blue.",o:["A","An","The"],a:2,e:"Nhắc lại lần thứ hai → <b>The</b>."},
{t:"mc",q:"Câu nào <b>đúng</b>?",o:["I play the tennis.","I play tennis.","I play a tennis."],a:1,e:"Không dùng mạo từ trước môn thể thao."},
{t:"f",q:"My mum is ___ English teacher. (a/an/the)",a:["an"],e:"English bắt đầu bằng nguyên âm → <b>an</b>."}]},

{id:"b4",lv:1,t:"Subject & Object Pronouns",vi:"Đại từ chủ ngữ và đại từ túc từ",
pic:{type:"grid",items:[["🙋","I → me","tôi"],["🫵","you → you","bạn"],["👦","he → him","cậu ấy"],["👧","she → her","cô ấy"],["🐶","it → it","nó"],["👫","we → us","chúng tôi"],["👨‍👩‍👧","they → them","họ"]],cap:"Bên trái: đại từ chủ ngữ (đứng trước động từ) · Bên phải: đại từ túc từ (đứng sau động từ/giới từ)"},
ex:[
"<b>Đại từ</b> (pronoun) dùng để <b>thay thế danh từ</b>, giúp câu không bị lặp. Ví dụ: “Lan is my friend. <b>She</b> is kind. I like <b>her</b>.” – she và her đều thay cho Lan.",
"Đại từ có <b>hai dạng</b> tùy theo vai trò trong câu. Đây là phần rất quan trọng để hiểu <b>túc từ</b>!",
"<b>Đại từ chủ ngữ</b> (subject pronouns) đứng <b>trước động từ</b>, làm chủ ngữ: [[I/Pr.S]], [[you/Pr.S]], [[he/Pr.S]], [[she/Pr.S]], [[it/Pr.S]], [[we/Pr.S]], [[they/Pr.S]].",
"<b>Đại từ túc từ</b> (object pronouns) đứng <b>sau động từ</b> hoặc <b>sau giới từ</b> (with, for, to, at…), làm túc từ: [[me/Pr.O]], [[you/Pr.O]], [[him/Pr.O]], [[her/Pr.O]], [[it/Pr.O]], [[us/Pr.O]], [[them/Pr.O]].",
"So sánh: [[She/Pr.S]] [[loves/V]] [[him/Pr.O]]. (Cô ấy yêu quý cậu ấy) ↔ [[He/Pr.S]] [[loves/V]] [[her/Pr.O]]. (Cậu ấy yêu quý cô ấy). Cùng một người nhưng ở vị trí khác nhau thì dùng dạng khác nhau.",
"<b>Mẹo:</b> hãy hỏi “Ai làm hành động?” → dạng chủ ngữ. “Hành động tác động lên ai?” → dạng túc từ. Sau giới từ <b>luôn</b> dùng dạng túc từ: <i>Come with <b>me</b>. This gift is for <b>her</b>. Look at <b>them</b>.</i>"],
f:[["Chủ ngữ","S:I / you / he / she / it / we / they + V:Động từ"],["Túc từ","S:Chủ ngữ + V:Động từ + O:me / you / him / her / it / us / them"],["Sau giới từ","P:with / for / to / at + O:me / him / her / us / them"]],
eg:[
["I/Pr.S like/V her/Pr.O.","Tôi thích cô ấy."],
["She/Pr.S likes/V me/Pr.O too/Adv.","Cô ấy cũng thích tôi."],
["We/Pr.S help/V them/Pr.O.","Chúng tôi giúp họ."],
["They/Pr.S help/V us/Pr.O.","Họ giúp chúng tôi."],
["Mum/N.S calls/V him/Pr.O for/P dinner/N.","Mẹ gọi cậu ấy ăn tối."],
["This/D present/N.S is/V for/P you/Pr.O.","Món quà này là dành cho bạn."],
["Please/Adv play/V with/P us/Pr.O!","Hãy chơi với chúng tớ nhé!"],
["My/D dog/N.S is/V lovely/A. I/Pr.S love/V it/Pr.O.","Con chó của tôi rất đáng yêu. Tôi yêu nó."]],
note:["<b>Lỗi thường gặp:</b> ❌ Me like ice cream. → ✅ <b>I</b> like ice cream.  ❌ She helps I. → ✅ She helps <b>me</b>.  ❌ Him is my friend. → ✅ <b>He</b> is my friend.","<b>you</b> và <b>it</b> giống nhau ở cả hai dạng, nên phải dựa vào vị trí trong câu để biết là chủ ngữ hay túc từ."],
q:[
{t:"mc",q:"___ am a student.",o:["I","Me","My"],a:0,e:"Đứng đầu câu, trước động từ → dạng chủ ngữ <b>I</b>."},
{t:"mc",q:"Can you help ___?",o:["I","me","my"],a:1,e:"Sau động từ help → dạng túc từ <b>me</b>."},
{t:"mc",q:"Tom is my friend. I play with ___ every day.",o:["he","him","his"],a:1,e:"Sau giới từ with → dạng túc từ <b>him</b>."},
{t:"mc",q:"Look at those birds! ___ are flying.",o:["Them","They","Their"],a:1,e:"Chủ ngữ của động từ are flying → <b>They</b>."},
{t:"mc",q:"Anna has a kitten. She loves ___.",o:["it","its","they"],a:0,e:"Thay cho a kitten (số ít) ở vị trí túc từ → <b>it</b>."},
{t:"f",q:"My parents love me and I love ___ .",a:["them"],e:"Thay cho my parents (số nhiều) làm túc từ → <b>them</b>."},
{t:"f",q:"Lucy and I are cousins. ___ often play together.",a:["we"],e:"Lucy and I = chúng tôi, làm chủ ngữ → <b>We</b>."},
{t:"mc",q:"The teacher gives ___ a lot of homework.",o:["we","us","our"],a:1,e:"Túc từ (người nhận) → <b>us</b>."},

{id:"b5",lv:1,t:"Verb “to be”",vi:"Động từ to be: am, is, are",
pic:{type:"grid",items:[["🙋","I am","= I'm"],["👦","He is","= He's"],["👧","She is","= She's"],["🐶","It is","= It's"],["👫","We are","= We're"],["🫵","You are","= You're"],["👥","They are","= They're"]]},
ex:[
"<b>to be</b> là động từ đặc biệt nhất tiếng Anh, nghĩa là “thì, là, ở”. Ở hiện tại nó có 3 dạng: [[am/V]], [[is/V]], [[are/V]].",
"<b>Cách chia:</b> I → <b>am</b>; he / she / it / danh từ số ít → <b>is</b>; you / we / they / danh từ số nhiều → <b>are</b>.",
"<b>Sau to be thường là:</b> một <b>tính từ</b> ([[She/Pr.S]] [[is/V]] [[happy/A]]), một <b>danh từ</b> ([[He/Pr.S]] [[is/V]] [[a_pilot/N]]), hoặc một <b>giới từ + nơi chốn</b> ([[The_cat/N.S]] [[is/V]] [[under/P]] [[the_bed/N]]). Phần đứng sau to be gọi là <b>bổ ngữ</b>, KHÔNG phải túc từ, vì to be không phải hành động tác động lên ai.",
"<b>Phủ định:</b> thêm [[not/Adv]] sau to be: I am not = I'm not; is not = <b>isn't</b>; are not = <b>aren't</b>.",
"<b>Câu hỏi:</b> đưa to be lên <b>đầu câu</b>: <i>Is she happy? – Yes, she is. / No, she isn't.</i> <i>Are you a student? – Yes, I am.</i>"],
f:[["Khẳng định","S:Chủ ngữ + V:am / is / are + A:Tính từ / N:Danh từ"],["Phủ định","S:Chủ ngữ + V:am / is / are + Adv:not + X:…"],["Câu hỏi","V:Am / Is / Are + S:Chủ ngữ + X:… ?"]],
eg:[
["I/Pr.S am/V nine/A years_old/A.","Tôi 9 tuổi."],
["She/Pr.S is/V my/D sister/N.","Cô ấy là chị gái tôi."],
["The/D elephants/N.S are/V very/Adv big/A.","Những con voi rất to."],
["My/D school/N.S is/V near/P the/D park/N.","Trường tôi ở gần công viên."],
["He/Pr.S is/V not/Adv hungry/A.","Cậu ấy không đói."],
["We/Pr.S aren't/V tired/A.","Chúng tôi không mệt."],
["Is/V your/D mum/N.S a/D nurse/N?","Mẹ bạn có phải là y tá không?"],
["Are/V they/Pr.S in/P the/D garden/N?","Họ có ở trong vườn không?"]],
note:["<b>Lỗi thường gặp:</b> ❌ I is → ✅ I <b>am</b>; ❌ They is → ✅ They <b>are</b>; ❌ She happy. (thiếu động từ) → ✅ She <b>is</b> happy.","Người Việt hay quên to be vì tiếng Việt nói “Cô ấy vui” không cần chữ “thì”. Tiếng Anh <b>bắt buộc</b> phải có động từ trong câu."],
q:[
{t:"mc",q:"My father ___ a farmer.",o:["am","is","are"],a:1,e:"My father = he → <b>is</b>."},
{t:"mc",q:"You and Tom ___ good friends.",o:["am","is","are"],a:2,e:"You and Tom = they (số nhiều) → <b>are</b>."},
{t:"mc",q:"I ___ not sad. I'm happy!",o:["am","is","are"],a:0,e:"I đi với <b>am</b>."},
{t:"f",q:"The books ___ on the shelf.",a:["are"],e:"The books số nhiều → <b>are</b>."},
{t:"f",q:"It ___ cold today. (phủ định, viết tắt)",a:["isn't","is not"],e:"It + is not = <b>isn't</b>."},
{t:"mc",q:"___ your brother at home? – Yes, he is.",o:["Am","Is","Are"],a:1,e:"Câu hỏi với your brother (he) → <b>Is</b>."},
{t:"mc",q:"Câu nào <b>đúng</b>?",o:["She very tall.","She is very tall.","She are very tall."],a:1,e:"Phải có to be, she đi với is."},
{t:"o",a:"Are the children in the classroom?",e:"Câu hỏi: Are + chủ ngữ (the children) + nơi chốn."}]},

{id:"b6",lv:1,t:"Possessives",vi:"Tính từ sở hữu và sở hữu cách ’s",
pic:{type:"grid",items:[["🎒","my bag","của tôi"],["🧢","his cap","của cậu ấy"],["👗","her dress","của cô ấy"],["🦴","its bone","của nó"],["🏠","our house","của chúng tôi"],["🚲","Tom's bike","của Tom"]]},
ex:[
"<b>Tính từ sở hữu</b> (possessive adjectives) cho biết vật <b>của ai</b>. Chúng là từ hạn định, luôn đứng <b>trước danh từ</b>: [[my/D]], [[your/D]], [[his/D]], [[her/D]], [[its/D]], [[our/D]], [[their/D]].",
"Bảng đối chiếu: I → <b>my</b>; you → <b>your</b>; he → <b>his</b>; she → <b>her</b>; it → <b>its</b>; we → <b>our</b>; they → <b>their</b>.",
"<b>Sở hữu cách ’s</b>: thêm <b>’s</b> sau tên người hoặc danh từ chỉ người/con vật: Tom<b>’s</b> bike (xe đạp của Tom), my mum<b>’s</b> car, the dog<b>’s</b> bone. Danh từ số nhiều đã có -s thì chỉ thêm dấu ’: the girls<b>’</b> room. Số nhiều bất quy tắc: the children<b>’s</b> toys.",
"<b>Câu hỏi “của ai?”</b> dùng [[Whose/Q]]: <i>Whose bag is this? – It's Lan's.</i>",
"Chú ý phân biệt: <b>its</b> (của nó) ≠ <b>it's</b> (= it is). <b>their</b> (của họ) ≠ <b>they're</b> (= they are)."],
f:[["Tính từ sở hữu","D:my / your / his / her / its / our / their + N:Danh từ"],["Sở hữu cách","N:Người sở hữu + X:’s + N:Vật"]],
eg:[
["This/D is/V my/D pencil/N.","Đây là bút chì của tôi."],
["His/D name/N.S is/V Ben/N.","Tên cậu ấy là Ben."],
["Her/D hair/N.S is/V long/A and/C curly/A.","Tóc cô ấy dài và xoăn."],
["The/D cat/N.S is/V eating/V its/D food/N.O.","Con mèo đang ăn thức ăn của nó."],
["Our/D classroom/N.S is/V big/A.","Lớp học của chúng tôi rộng."],
["Peter's/N sister/N.S is/V a/D singer/N.","Chị gái của Peter là ca sĩ."],
["Whose/Q shoes/N.S are/V these/Pr? They're/V my/D cousin's/N.","Đây là giày của ai? Của anh họ tôi."]],
note:["<b>Lỗi thường gặp:</b> ❌ She is washing his hair (khi nói tóc của chính cô ấy) → ✅ She is washing <b>her</b> hair. Tính từ sở hữu theo <b>người sở hữu</b>, không theo vật.","❌ the bike of Tom → ✅ <b>Tom's</b> bike (với người, dùng ’s tự nhiên hơn)."],
q:[
{t:"mc",q:"I have a dog. ___ dog is white.",o:["My","Me","I"],a:0,e:"Đứng trước danh từ dog → tính từ sở hữu <b>My</b>."},
{t:"mc",q:"Linda is brushing ___ teeth.",o:["his","her","its"],a:1,e:"Linda là nữ → <b>her</b>."},
{t:"mc",q:"The bird is in ___ nest.",o:["it's","its","it"],a:1,e:"<b>its</b> = của nó. it's = it is."},
{t:"f",q:"This is the bag of Mary. → This is ___ bag.",a:["mary's"],e:"Sở hữu cách: <b>Mary's</b> bag."},
{t:"mc",q:"We love ___ grandparents.",o:["us","our","we"],a:1,e:"Trước danh từ → <b>our</b>."},
{t:"mc",q:"___ pen is this? – It's Jim's.",o:["Who","Whose","What"],a:1,e:"Hỏi của ai → <b>Whose</b>."},
{t:"f",q:"The children play with ___ toys. (của họ)",a:["their"],e:"they → <b>their</b>."},
{t:"o",a:"My uncle's car is red.",e:"Sở hữu cách: My uncle's car = xe của chú tôi."}]},

ex:[
"Bốn từ chỉ định giúp em chỉ vào vật ở <b>gần</b> hay ở <b>xa</b>, <b>một</b> hay <b>nhiều</b>.",
"<b>this</b> (này) – một vật ở gần · <b>that</b> (kia/đó) – một vật ở xa · <b>these</b> (những… này) – nhiều vật ở gần · <b>those</b> (những… kia) – nhiều vật ở xa.",
"<b>Cách dùng 1 – đứng trước danh từ</b> (làm từ hạn định): [[this/D]] [[book/N]], [[those/D]] [[birds/N]].",
"<b>Cách dùng 2 – đứng một mình</b> (làm đại từ): [[This/Pr.S]] [[is/V]] [[my/D]] [[friend/N]]. [[Those/Pr.S]] [[are/V]] [[my/D]] [[shoes/N]].",
"this/that đi với <b>is</b> và danh từ số ít; these/those đi với <b>are</b> và danh từ số nhiều. Khi trả lời, dùng <b>it</b> cho this/that và <b>they</b> cho these/those: <i>What's that? – It's a kite. What are these? – They're shells.</i>"],

["These/D flowers/N.S are/V for/P you/Pr.O.","Những bông hoa này dành cho bạn."],
["Look_at/V those/D clouds/N.O!","Nhìn những đám mây kia kìa!"],
["This/Pr.S is/V my/D best/A friend/N, Mai/N.","Đây là bạn thân nhất của tôi, Mai."],
["What/Q are/V those/Pr.S? They/Pr.S are/V kangaroos/N.","Những con kia là gì? Chúng là chuột túi."]],

{t:"mc",q:"___ shoes are too small for me. (đang cầm trên tay)",o:["This","That","These","Those"],a:2,e:"Gần + số nhiều → <b>These</b>."},
{t:"mc",q:"___ is my brother, Jack. (đứng cạnh tôi)",o:["This","These","Those"],a:0,e:"Giới thiệu một người ở gần → <b>This</b>."},
{t:"mc",q:"Those ___ my cousins.",o:["is","are"],a:1,e:"those số nhiều → <b>are</b>."},

{id:"b8",lv:1,t:"There is / There are",vi:"Có… (chỉ sự tồn tại)",
pic:{type:"grid",items:[["🐱","There is a cat.","một → is"],["🐟🐟🐟","There are three fish.","nhiều → are"],["🥛","There is some milk.","không đếm được → is"],["🚫🐘","There aren't any elephants.","phủ định"]]},
ex:[
"<b>There is / There are</b> nghĩa là “<b>có</b>” – dùng để nói về sự <b>tồn tại</b> của người/vật ở một nơi nào đó. Đừng nhầm với <b>have</b> (sở hữu)!",
"<b>There is</b> (= There's) + danh từ <b>số ít</b> hoặc <b>không đếm được</b>: There is a pen. There is some water.",
"<b>There are</b> + danh từ <b>số nhiều</b>: There are two pens. There are many students.",
"<b>Phủ định:</b> There isn't a… / There aren't any… <b>Câu hỏi:</b> Is there a…? / Are there any…? – Yes, there is / are. No, there isn't / aren't.",
"<b>Hỏi số lượng:</b> <i>How many</i> + danh từ số nhiều + <i>are there</i>? → How many chairs are there? – There are six chairs.",
"Trong câu này, <b>danh từ sau is/are mới là chủ ngữ thật</b>: “There are three fish” → three fish là thứ tồn tại."],
f:[["Số ít","X:There + V:is + D:a / an + N:Danh từ + P:nơi chốn"],["Số nhiều","X:There + V:are + D:two / some / many + N:Danh từ số nhiều"],["Câu hỏi","V:Is / Are + X:there + D:a / any + N:Danh từ + X:?"]],

["There/Pr are/V five/D ducks/N.S on/P the/D lake/N.","Có năm con vịt trên hồ."],
["There/Pr is/V some/D juice/N.S in/P the/D bottle/N.","Có một ít nước ép trong chai."],
["There/Pr aren't/V any/D clouds/N.S in/P the/D sky/N.","Không có đám mây nào trên trời."],
["Is/V there/Pr a/D library/N.S near/P here/Adv?","Có thư viện nào gần đây không?"],
["How_many/Q students/N.S are/V there/Pr in/P your/D class/N?","Lớp bạn có bao nhiêu học sinh?"]],

{t:"mc",q:"___ there any milk in the fridge?",o:["Is","Are"],a:0,e:"milk không đếm được → <b>Is</b>."},
{t:"f",q:"How many windows ___ there in the classroom?",a:["are"],e:"How many + số nhiều → <b>are</b>."},
{t:"f",q:"There ___ any pencils in my bag. (phủ định, viết tắt)",a:["aren't","are not"],e:"pencils số nhiều, phủ định → <b>aren't</b>."},
{t:"o",a:"Is there a hospital in your village?",e:"Câu hỏi: Is + there + a + danh từ + nơi chốn."}]},

{id:"b9",lv:1,t:"Have got / Has got",vi:"Có (sở hữu): have got, has got",
pic:{type:"grid",items:[["👧🐶","She has got a dog."],["👦🚲","He has got a bike."],["👫🐠","We have got a fish."],["🙋👓","I have got glasses."]]},
ex:[
"<b>have got / has got</b> (hoặc chỉ <b>have / has</b>) nghĩa là “<b>có</b>” theo nghĩa <b>sở hữu</b>: có đồ vật, có người thân, có đặc điểm cơ thể.",
"<b>I / you / we / they</b> + <b>have got</b> (='ve got) · <b>he / she / it</b> + <b>has got</b> (='s got).",
"Thứ được sở hữu chính là <b>túc từ</b> của câu: [[She/Pr.S]] [[has_got/V]] [[a_cat/N.O]].",
"<b>Phủ định:</b> haven't got / hasn't got. <b>Câu hỏi:</b> Have you got…? – Yes, I have. / No, I haven't. Has he got…? – Yes, he has.",
"Với <b>have</b> (không có got) thì câu hỏi và phủ định mượn trợ động từ do/does: <i>Do you have a pet? She doesn't have a pet.</i>"],
f:[["Khẳng định","S:I / you / we / they + V:have got + O:Túc từ"],["Khẳng định","S:he / she / it + V:has got + O:Túc từ"],["Câu hỏi","Aux:Have / Has + S:Chủ ngữ + V:got + O:… ?"]],
eg:[
["I/Pr.S have_got/V a/D new/A bike/N.O.","Tôi có một chiếc xe đạp mới."],
["My/D sister/N.S has_got/V long/A hair/N.O.","Chị gái tôi có mái tóc dài."],
["They/Pr.S haven't_got/V a/D car/N.O.","Họ không có ô tô."],
["Has/Aux your/D dad/N.S got/V a/D beard/N.O?","Bố bạn có râu không?"],
["A/D spider/N.S has_got/V eight/D legs/N.O.","Con nhện có tám chân."],
["We/Pr.S have/V two/D cousins/N.O in/P Hanoi/N.","Chúng tôi có hai người anh họ ở Hà Nội."]],
note:["<b>Lỗi thường gặp:</b> ❌ She have got → ✅ She <b>has</b> got; ❌ He's got? (câu hỏi) → ✅ <b>Has</b> he got…?","Đừng nhầm <b>He's got</b> (= He has got) với <b>He's</b> (= He is). Nhìn chữ got phía sau để biết."],
q:[
{t:"mc",q:"Ben ___ a red kite.",o:["have got","has got"],a:1,e:"Ben = he → <b>has got</b>."},
{t:"mc",q:"We ___ a big garden.",o:["have got","has got"],a:0,e:"we → <b>have got</b>."},
{t:"mc",q:"___ you got a brother?",o:["Have","Has","Do"],a:0,e:"Câu hỏi với have got: <b>Have</b> you got…?"},
{t:"mc",q:"Has she got a pet? – No, she ___ .",o:["haven't","hasn't","isn't"],a:1,e:"Trả lời ngắn: No, she <b>hasn't</b>."},
{t:"f",q:"A giraffe ___ got a long neck.",a:["has"],e:"A giraffe = it → <b>has</b> got."},
{t:"f",q:"I ___ got any money. (phủ định)",a:["haven't","have not"],e:"I → <b>haven't</b> got."},
{t:"o",a:"Have you got a pencil?",e:"Câu hỏi: Have + you + got + túc từ?"}]},

{id:"b10",lv:1,t:"Can / Can't",vi:"Có thể / không thể (khả năng)",
pic:{type:"grid",items:[["🐟","Fish can swim.","✔"],["🐦","Birds can fly.","✔"],["🐧","Penguins can't fly.","✘"],["🐘","Elephants can't jump.","✘"]]},
ex:[
"[[can/Aux]] là <b>động từ khuyết thiếu</b> (modal verb), một loại trợ động từ. Nghĩa: <b>có thể, biết</b> (làm gì). Dùng để nói về <b>khả năng</b>, xin phép và đề nghị.",
"<b>Quy tắc vàng:</b> sau can luôn là <b>động từ nguyên mẫu không “to”</b>, và can <b>không đổi</b> theo chủ ngữ: I can swim, she <b>can</b> swim (❌ she cans, ❌ she can swims, ❌ can to swim).",
"<b>Phủ định:</b> cannot = <b>can't</b>. <b>Câu hỏi:</b> đưa can lên đầu câu: <i>Can you ride a bike? – Yes, I can. / No, I can't.</i>",
"<b>Xin phép:</b> <i>Can I go out, please?</i> · <b>Nhờ vả:</b> <i>Can you help me?</i>",
"Trong câu, [[can/Aux]] là trợ động từ, còn động từ chính ngay sau nó: [[She/Pr.S]] [[can/Aux]] [[play/V]] [[the_piano/N.O]]."],
f:[["Khẳng định","S:Chủ ngữ + Aux:can + V:V nguyên mẫu + O:…"],["Phủ định","S:Chủ ngữ + Aux:can't + V:V nguyên mẫu"],["Câu hỏi","Aux:Can + S:Chủ ngữ + V:V nguyên mẫu + X:… ?"]],
eg:[
["I/Pr.S can/Aux swim/V very/Adv well/Adv.","Tôi bơi rất giỏi."],
["My/D grandma/N.S can't/Aux use/V a/D computer/N.O.","Bà tôi không biết dùng máy tính."],
["Kangaroos/N.S can/Aux jump/V high/Adv.","Chuột túi nhảy được cao."],
["Can/Aux you/Pr.S speak/V English/N.O?","Bạn có nói được tiếng Anh không?"],
["Can/Aux I/Pr.S borrow/V your/D ruler/N.O, please/Adv?","Mình mượn thước của bạn được không?"],
["Penguins/N.S can't/Aux fly/V, but/C they/Pr.S can/Aux swim/V.","Chim cánh cụt không bay được nhưng bơi được."]],
note:["<b>Lỗi thường gặp:</b> ❌ He can sings. → ✅ He can <b>sing</b>. ❌ Do you can swim? → ✅ <b>Can you</b> swim? ❌ I can to dance. → ✅ I can dance."],
q:[
{t:"mc",q:"My cat can ___ trees.",o:["climb","climbs","to climb"],a:0,e:"Sau can là động từ nguyên mẫu → <b>climb</b>."},
{t:"mc",q:"___ you play chess?",o:["Do","Can","Are"],a:1,e:"Câu hỏi khả năng → <b>Can</b> you…?"},
{t:"mc",q:"Snakes ___ walk. They haven't got legs.",o:["can","can't"],a:1,e:"Rắn không có chân → <b>can't</b> walk."},
{t:"f",q:"Can she ride a horse? – Yes, she ___ .",a:["can"],e:"Trả lời ngắn: Yes, she <b>can</b>."},
{t:"mc",q:"Câu nào <b>đúng</b>?",o:["Tom cans dance.","Tom can dances.","Tom can dance."],a:2,e:"can không đổi, động từ sau giữ nguyên mẫu."},
{t:"f",q:"I ___ see the board. It's too far. (không thể)",a:["can't","cannot"],e:"Phủ định → <b>can't</b>."},
{t:"o",a:"Can you help me, please?",e:"Câu nhờ vả: Can + you + V + túc từ me."}]},

{id:"b11",lv:1,t:"Present Simple",vi:"Thì hiện tại đơn",
pic:{type:"time",m:"repeat",cap:"Hành động lặp lại thường xuyên, thói quen, sự thật"},
ex:[
"<b>Thì hiện tại đơn</b> dùng để nói về: <b>thói quen</b> hằng ngày (I get up at 6), <b>sự thật</b> hiển nhiên (The sun rises in the east), <b>sở thích, cảm xúc</b> (She likes cats) và <b>lịch trình</b> (The bus leaves at 7).",
"<b>Khẳng định:</b> I / you / we / they + <b>V nguyên mẫu</b>. He / she / it + <b>V-s/es</b>. Đây là điểm dễ sai nhất!",
"<b>Cách thêm s/es cho động từ:</b> đa số thêm <b>-s</b> (play → plays, read → reads); tận cùng -o, -s, -sh, -ch, -x thêm <b>-es</b> (go → goes, watch → watches, wash → washes, do → does); phụ âm + y → <b>-ies</b> (fly → flies, study → studies, cry → cries); đặc biệt: have → <b>has</b>.",
"<b>Phủ định và câu hỏi</b> mượn trợ động từ [[do/Aux]] / [[does/Aux]]. Khi đã dùng does thì động từ chính <b>trở về nguyên mẫu</b>: She plays → She <b>doesn't play</b> → <b>Does</b> she <b>play</b>?",
"<b>Dấu hiệu nhận biết:</b> always, usually, often, sometimes, never, every day / week / morning, on Mondays, once a week, twice a month."],
f:[["Khẳng định","S:I / You / We / They + V:V nguyên mẫu + O:…"],["Khẳng định","S:He / She / It + V:V-s / es + O:…"],["Phủ định","S:Chủ ngữ + Aux:don't / doesn't + V:V nguyên mẫu"],["Câu hỏi","Aux:Do / Does + S:Chủ ngữ + V:V nguyên mẫu + X:… ?"]],
eg:[
["I/Pr.S get_up/V at/P six/N every_day/Adv.","Tôi thức dậy lúc 6 giờ mỗi ngày."],
["My/D mother/N.S cooks/V dinner/N.O in/P the/D evening/N.","Mẹ tôi nấu bữa tối vào buổi tối."],
["He/Pr.S watches/V cartoons/N.O on/P Sundays/N.","Cậu ấy xem phim hoạt hình vào Chủ nhật."],
["Water/N.S boils/V at/P 100/D degrees/N.","Nước sôi ở 100 độ."],
["We/Pr.S don't/Aux eat/V meat/N.O.","Chúng tôi không ăn thịt."],
["She/Pr.S doesn't/Aux like/V spiders/N.O.","Cô ấy không thích nhện."],
["Does/Aux your/D brother/N.S play/V the_guitar/N.O?","Anh bạn có chơi ghi-ta không?"],
["What/Q time/N do/Aux you/Pr.S go/V to/P school/N?","Bạn đi học lúc mấy giờ?"]],
note:["<b>Lỗi thường gặp:</b> ❌ She like ice cream. → ✅ She <b>likes</b>. ❌ He doesn't likes. → ✅ He doesn't <b>like</b>. ❌ Does she plays? → ✅ Does she <b>play</b>?","<b>Mẹo nhớ:</b> chữ <b>s</b> chỉ xuất hiện <b>một lần</b>: hoặc ở động từ (She play<b>s</b>), hoặc ở trợ động từ (She doe<b>s</b>n't play)."],
q:[
{t:"f",q:"My dad ___ (go) to work by bus.",a:["goes"],e:"he + go → thêm -es: <b>goes</b>."},
{t:"f",q:"She ___ (study) English every evening.",a:["studies"],e:"Phụ âm + y → <b>studies</b>."},
{t:"mc",q:"They ___ football after school.",o:["play","plays","playing"],a:0,e:"They → động từ nguyên mẫu <b>play</b>."},
{t:"mc",q:"Tom ___ like carrots.",o:["don't","doesn't","isn't"],a:1,e:"Tom = he → <b>doesn't</b>."},
{t:"mc",q:"___ your sister wear glasses?",o:["Do","Does","Is"],a:1,e:"your sister = she → <b>Does</b>."},
{t:"mc",q:"Does he ___ in a big city?",o:["live","lives","living"],a:0,e:"Sau does dùng nguyên mẫu <b>live</b>."},
{t:"f",q:"The baby ___ (cry) at night.",a:["cries"],e:"cry → <b>cries</b>."},
{t:"f",q:"Kim ___ (have) a shower every morning.",a:["has"],e:"have với he/she/it → <b>has</b>."},
{t:"o",a:"Where does your uncle work?",e:"Câu hỏi Wh-: Where + does + chủ ngữ + V nguyên mẫu?"}]},

{id:"b12",lv:1,t:"Adverbs of Frequency",vi:"Trạng từ chỉ tần suất",
pic:{type:"freq",items:[["always",100],["usually",80],["often",60],["sometimes",40],["rarely",10],["never",0]]},
ex:[
"<b>Trạng từ tần suất</b> cho biết hành động xảy ra <b>bao lâu một lần</b>. Chúng là [[trạng_từ/Adv]] và hay đi với thì hiện tại đơn.",
"Từ nhiều đến ít: [[always/Adv]] (luôn luôn, 100%) → [[usually/Adv]] (thường xuyên) → [[often/Adv]] (hay) → [[sometimes/Adv]] (thỉnh thoảng) → [[rarely/Adv]] (hiếm khi) → [[never/Adv]] (không bao giờ, 0%).",
"<b>Vị trí 1 – trước động từ thường:</b> [[I/Pr.S]] [[always/Adv]] [[brush/V]] [[my/D]] [[teeth/N.O]].",
"<b>Vị trí 2 – sau động từ to be:</b> [[She/Pr.S]] [[is/V]] [[never/Adv]] [[late/A]].",
"<b>Câu hỏi:</b> <i>How often</i> do you…? – I go swimming <b>twice a week</b>. (once = 1 lần, twice = 2 lần, three times = 3 lần). Các cụm này đứng <b>cuối câu</b>.",
"never đã mang nghĩa phủ định, nên <b>không dùng thêm not</b>: ❌ I don't never… → ✅ I never…"],
f:[["Với động từ thường","S:Chủ ngữ + Adv:always / often… + V:Động từ"],["Với to be","S:Chủ ngữ + V:am / is / are + Adv:always / never…"]],
eg:[
["I/Pr.S always/Adv do/V my/D homework/N.O.","Tôi luôn làm bài tập về nhà."],
["Tom/N.S is/V usually/Adv happy/A.","Tom thường vui vẻ."],
["We/Pr.S often/Adv go/V to/P the/D park/N.","Chúng tôi hay đi công viên."],
["My/D cat/N.S sometimes/Adv sleeps/V on/P my/D bed/N.","Con mèo đôi khi ngủ trên giường tôi."],
["She/Pr.S never/Adv drinks/V coffee/N.O.","Cô ấy không bao giờ uống cà phê."],
["How_often/Q do/Aux you/Pr.S visit/V your/D grandparents/N.O?","Bạn có hay thăm ông bà không?"]],
note:["<b>Lỗi thường gặp:</b> ❌ I go always to school by bike. → ✅ I <b>always go</b> to school by bike. ❌ She always is kind. → ✅ She <b>is always</b> kind."],
q:[
{t:"o",a:"I usually walk to school.",e:"Trạng từ tần suất đứng trước động từ thường."},
{t:"o",a:"He is always late.",e:"Trạng từ tần suất đứng sau to be."},
{t:"mc",q:"I don't like fish. I ___ eat it.",o:["always","often","never"],a:2,e:"Không thích → <b>never</b> (không bao giờ)."},
{t:"mc",q:"Câu nào <b>đúng</b>?",o:["She sometimes is tired.","She is sometimes tired.","She is tired sometimes is."],a:1,e:"Sau to be: is <b>sometimes</b>."},
{t:"mc",q:"___ do you go swimming? – Twice a week.",o:["How many","How often","How much"],a:1,e:"Hỏi tần suất → <b>How often</b>."},
{t:"mc",q:"Mức độ nào <b>cao nhất</b>?",o:["often","usually","always","sometimes"],a:2,e:"<b>always</b> = 100%."},
{t:"f",q:"2 lần một tuần = ___ a week",a:["twice","two times"],e:"<b>twice</b> a week."}]},

{id:"b13",lv:1,t:"Present Continuous",vi:"Thì hiện tại tiếp diễn",
pic:[{type:"time",m:"now",cap:"Hành động đang xảy ra ngay lúc nói"},{type:"grid",items:[["🏃","She is running."],["😴","The baby is sleeping."],["🎨","They are drawing."]]}],
ex:[
"<b>Thì hiện tại tiếp diễn</b> diễn tả hành động <b>đang xảy ra ngay lúc nói</b> (Look! It's raining) hoặc trong khoảng thời gian hiện tại (I'm reading a good book these days).",
"<b>Cấu trúc:</b> am / is / are + <b>V-ing</b>. Ở đây [[am/Aux]] [[is/Aux]] [[are/Aux]] là <b>trợ động từ</b>, còn động từ chính là V-ing: [[She/Pr.S]] [[is/Aux]] [[reading/V]] [[a_book/N.O]].",
"<b>Cách thêm -ing:</b> thường thêm -ing (play → playing, read → reading); tận cùng <b>-e</b> thì bỏ e (dance → dancing, write → writing, make → making); <b>một nguyên âm + một phụ âm</b> ở cuối từ ngắn thì <b>gấp đôi phụ âm</b> (run → running, swim → swimming, sit → sitting, get → getting, stop → stopping); -ie → -ying (lie → lying).",
"<b>Phủ định:</b> am not / isn't / aren't + V-ing. <b>Câu hỏi:</b> Am / Is / Are + S + V-ing? – Yes, I am. / No, she isn't.",
"<b>Dấu hiệu:</b> now, right now, at the moment, today, Look!, Listen!, Be quiet!",
"<b>Động từ trạng thái</b> (like, love, want, know, need, understand, have = sở hữu) thường <b>không</b> dùng tiếp diễn: ❌ I am liking it → ✅ I like it."],
f:[["Khẳng định","S:Chủ ngữ + Aux:am / is / are + V:V-ing + O:…"],["Phủ định","S:Chủ ngữ + Aux:am not / isn't / aren't + V:V-ing"],["Câu hỏi","Aux:Am / Is / Are + S:Chủ ngữ + V:V-ing + X:… ?"]],
eg:[
["Look/V! The/D monkey/N.S is/Aux eating/V a/D banana/N.O.","Nhìn kìa! Con khỉ đang ăn chuối."],
["I/Pr.S am/Aux writing/V a/D letter/N.O now/Adv.","Bây giờ tôi đang viết thư."],
["The/D children/N.S are/Aux swimming/V in/P the/D sea/N.","Bọn trẻ đang bơi ở biển."],
["It/Pr.S isn't/Aux raining/V at_the_moment/Adv.","Lúc này trời không mưa."],
["Are/Aux you/Pr.S listening/V to/P me/Pr.O?","Bạn có đang nghe tôi nói không?"],
["What/Q is/Aux Dad/N.S doing/V? He/Pr.S is/Aux washing/V the/D car/N.O.","Bố đang làm gì? Bố đang rửa xe."]],
note:["<b>So sánh:</b> <i>She <b>plays</b> tennis every Sunday.</i> (thói quen – hiện tại đơn) ↔ <i>She <b>is playing</b> tennis now.</i> (đang xảy ra – hiện tại tiếp diễn).","<b>Lỗi thường gặp:</b> ❌ She reading. (thiếu is) → ✅ She <b>is</b> reading. ❌ He is swiming → ✅ swi<b>mm</b>ing."],
q:[
{t:"f",q:"Listen! The birds ___ (sing).",a:["are singing","'re singing"],e:"Listen! → đang xảy ra; birds số nhiều → <b>are singing</b>."},
{t:"f",q:"swim → ___ (thêm -ing)",a:["swimming"],e:"Gấp đôi m: <b>swimming</b>."},
{t:"f",q:"write → ___ (thêm -ing)",a:["writing"],e:"Bỏ e rồi thêm -ing: <b>writing</b>."},
{t:"mc",q:"Be quiet! The baby ___ .",o:["sleeps","is sleeping","sleep"],a:1,e:"Be quiet! → hành động đang xảy ra → <b>is sleeping</b>."},
{t:"mc",q:"___ they playing football now?",o:["Do","Is","Are"],a:2,e:"they → <b>Are</b>."},
{t:"mc",q:"My dad usually ___ coffee, but today he ___ tea.",o:["drinks / is drinking","is drinking / drinks","drink / drinking"],a:0,e:"usually → hiện tại đơn; today (lúc này) → hiện tại tiếp diễn."},
{t:"mc",q:"Câu nào <b>đúng</b>?",o:["I am wanting a drink.","I want a drink.","I wanting a drink."],a:1,e:"want là động từ trạng thái → không dùng tiếp diễn."},
{t:"o",a:"What are you doing now?",e:"What + are + you + doing + now?"}]},

{id:"b14",lv:1,t:"Prepositions of Place",vi:"Giới từ chỉ nơi chốn",
pic:{type:"prep"},
ex:[
"<b>Giới từ chỉ nơi chốn</b> cho biết người/vật <b>ở đâu</b> so với vật khác. Giới từ luôn đi kèm một danh từ hoặc đại từ phía sau: [[under/P]] [[the_table/N]].",
"[[in/P]] – ở trong: in the box, in the room, in the garden, in Vietnam.",
"[[on/P]] – ở trên (tiếp xúc bề mặt): on the table, on the wall, on the floor.",
"[[under/P]] – ở dưới: under the bed, under the tree.",
"[[next_to/P]] (= beside) – bên cạnh · [[behind/P]] – ở phía sau · [[in_front_of/P]] – ở phía trước.",
"[[between/P]] – ở giữa <b>hai</b> vật (between A <b>and</b> B) · [[above/P]] – ở phía trên (không chạm) · [[opposite/P]] – đối diện · [[near/P]] – ở gần.",
"<b>Câu hỏi:</b> <i>Where is the ball? – It's under the chair.</i> <i>Where are my keys? – They're on the desk.</i>"],

"<b>in</b> + khoảng thời gian dài: <b>tháng</b> (in June), <b>mùa</b> (in summer), <b>năm</b> (in 2024), <b>buổi trong ngày</b> (in the morning, in the afternoon, in the evening).",

["Owls/N.S hunt/V at/P night/N.","Cú săn mồi vào ban đêm."],
["She/Pr.S reads/V in/P the/D evening/N.","Cô ấy đọc sách vào buổi tối."]],
note:["<b>Mẹo nhớ hình tam giác:</b> <b>in</b> (rộng nhất: năm, tháng, mùa) → <b>on</b> (ngày) → <b>at</b> (nhỏ nhất: giờ).","Chú ý: <b>in</b> the morning nhưng <b>on</b> Monday morning (vì có ngày cụ thể) và <b>at</b> night."],

{id:"b16",lv:1,t:"Imperatives & Let's",vi:"Câu mệnh lệnh và lời rủ “Let's”",

ex:[

"<b>Khẳng định:</b> [[Close/V]] [[the_door/N.O]]. [[Sit/V]] [[down/Adv]]. [[Listen/V]] [[carefully/Adv]].",
"<b>Phủ định (cấm):</b> <b>Don't</b> + V: [[Don't/Aux]] [[run/V]] [[in_the_classroom/N]]. Don't touch it!",
"<b>Lịch sự hơn:</b> thêm [[please/Adv]] ở đầu hoặc cuối câu: Please be quiet. / Pass me the salt, please.",
"<b>Let's</b> (= Let us) + V nguyên mẫu dùng để <b>rủ rê</b> làm gì cùng nhau: Let's go to the zoo! Phủ định: <b>Let's not</b> + V. Trả lời: <i>Good idea! / Yes, let's. / Sorry, I can't.</i>"],
f:[["Mệnh lệnh","V:V nguyên mẫu + O:…"],["Cấm","Aux:Don't + V:V nguyên mẫu + O:…"],["Rủ rê","X:Let's + V:V nguyên mẫu + O:…"]],

["Don't/Aux feed/V the/D animals/N.O!","Không cho thú ăn!"],
["Wash/V your/D hands/N.O before/P lunch/N.","Rửa tay trước bữa trưa."],
["Be/V careful/A!","Cẩn thận!"],

note:["<b>Lỗi thường gặp:</b> ❌ You don't run! (thường không nói kèm you) → ✅ Don't run! ❌ Let's to go. → ✅ Let's <b>go</b>. ❌ Not touch! → ✅ <b>Don't</b> touch!"],

ex:[

"[[What/Q]] – cái gì: What's your name? What do you like? · [[Where/Q]] – ở đâu: Where do you live? · [[Who/Q]] – ai: Who is that girl? · [[When/Q]] – khi nào: When is your birthday?",
"[[Why/Q]] – tại sao (trả lời bằng <b>Because…</b>): Why are you sad? – Because I lost my toy. · [[How/Q]] – như thế nào / bằng cách nào: How are you? How do you go to school? – By bus.",

["How_many/Q legs/N.O does/Aux a/D spider/N.S have/V?","Con nhện có bao nhiêu chân?"],

{id:"b18",lv:1,t:"Like / Love / Hate + V-ing, Want to",vi:"Nói về sở thích: like + V-ing, want to + V",

ex:[

"Sau like / love / hate / enjoy, nếu là một <b>hoạt động</b> ta dùng <b>V-ing</b>: I like <b>playing</b> football. Lúc này V-ing đóng vai trò như một danh từ – gọi là <b>danh động từ</b> – và nó chính là <b>túc từ</b> của câu: [[I/Pr.S]] [[like/V]] [[playing/V.O]] [[football/N]].",
"Cũng có thể dùng danh từ làm túc từ: I like <b>cats</b>. She loves <b>chocolate</b>.",

["I/Pr.S want/V to_be/V a/D doctor/N.","Tôi muốn trở thành bác sĩ."],
["Would/Aux you/Pr.S like/V a/D glass/N.O of/P milk/N?","Bạn có muốn một ly sữa không?"],

LESSONS.push(
{id:"i1",lv:2,t:"Adjectives",vi:"Tính từ: vị trí và thứ tự",
pic:{type:"grid",items:[["🐱","a cat","danh từ"],["🐱","a small cat","+ kích cỡ"],["🐈‍⬛","a small black cat","+ màu sắc"],["🧶","a lovely small black cat","+ ý kiến"]]},
ex:[
"<b>Tính từ</b> (adjective) miêu tả <b>danh từ</b>: hình dáng, kích cỡ, màu sắc, cảm xúc, tính cách, chất liệu… Tính từ tiếng Anh <b>không đổi hình thức</b> theo số ít/số nhiều: a red apple → two <b>red</b> apples (❌ reds apples).",
"<b>Vị trí 1 – đứng TRƯỚC danh từ:</b> [[a/D]] [[clever/A]] [[girl/N]], [[dirty/A]] [[shoes/N]]. Đây là điểm ngược với tiếng Việt: tiếng Việt nói “cô bé <i>thông minh</i>”, tiếng Anh nói “a <i>clever</i> girl”.",
"<b>Vị trí 2 – đứng SAU động từ nối</b> (be, look, feel, seem, become, get, taste, smell, sound): [[The_soup/N.S]] [[tastes/V]] [[delicious/A]]. [[You/Pr.S]] [[look/V]] [[tired/A]]. Lúc này tính từ miêu tả <b>chủ ngữ</b>.",
"<b>Thứ tự nhiều tính từ</b> (mẹo <b>OSASCOMP</b>): <b>O</b>pinion (ý kiến: nice, lovely) → <b>S</b>ize (kích cỡ: big, small) → <b>A</b>ge (tuổi: old, new) → <b>S</b>hape (hình dạng: round) → <b>C</b>olour (màu) → <b>O</b>rigin (nguồn gốc: Vietnamese) → <b>M</b>aterial (chất liệu: wooden, plastic) → <b>P</b>urpose (mục đích) + DANH TỪ. Ví dụ: a <b>beautiful big old</b> house; a <b>small round wooden</b> table.",
"<b>Tính từ đuôi -ed và -ing:</b> -ed nói về <b>cảm xúc của người</b> (I'm <b>bored</b> = tôi thấy chán), -ing nói về <b>tính chất của sự vật</b> gây ra cảm xúc (The film is <b>boring</b> = bộ phim chán). Tương tự: interested/interesting, excited/exciting, tired/tiring, frightened/frightening.",
"<b>Dấu hiệu nhận biết tính từ qua đuôi:</b> -ful (beautiful, careful), -less (careless), -y (sunny, funny), -ous (famous, dangerous), -al (national), -ive (expensive), -able (comfortable)."],
f:[["Trước danh từ","D:a / the + A:Tính từ + N:Danh từ"],["Sau động từ nối","S:Chủ ngữ + V:be / look / feel / taste… + A:Tính từ"],["Nhiều tính từ","A:Ý kiến + A:Kích cỡ + A:Tuổi + A:Màu + A:Chất liệu + N:Danh từ"]],
eg:[

{id:"i2",lv:2,t:"Comparatives",vi:"So sánh hơn",
pic:{type:"cmp",items:[["🐢","slow",34],["🐇","faster",54],["🐆","the fastest",74]],cap:"The rabbit is faster than the tortoise."},
ex:[
"<b>So sánh hơn</b> dùng khi so sánh <b>hai</b> người/vật. Luôn có từ [[than/C]] (hơn) đi sau tính từ.",
"<b>Tính từ ngắn</b> (1 âm tiết): thêm <b>-er</b>: tall → taller, small → smaller, old → older, fast → faster.",
"Tận cùng <b>-e</b>: chỉ thêm -r (nice → nicer, large → larger). <b>Một nguyên âm + một phụ âm</b>: gấp đôi phụ âm (big → bigger, hot → hotter, fat → fatter, thin → thinner). Tận cùng <b>-y</b>: đổi thành -ier (happy → happier, easy → easier, funny → funnier, heavy → heavier).",
"<b>Tính từ dài</b> (2–3 âm tiết trở lên): thêm <b>more</b> phía trước: beautiful → <b>more</b> beautiful, expensive → more expensive, interesting → more interesting, difficult → more difficult.",
"<b>Bất quy tắc</b> (phải thuộc): good → <b>better</b>, bad → <b>worse</b>, far → <b>farther/further</b>, much/many → <b>more</b>, little → <b>less</b>.",
"Sau than, đại từ dùng dạng <b>túc từ</b> trong văn nói: She is taller than <b>me</b>. (Văn viết: than I am.)"],
f:[["Tính từ ngắn","S:Chủ ngữ + V:be + A:adj-er + C:than + O:Người / vật"],["Tính từ dài","S:Chủ ngữ + V:be + Adv:more + A:adj + C:than + O:Người / vật"]],
eg:[
["An/D elephant/N.S is/V bigger/A than/C a/D horse/N.","Voi to hơn ngựa."],
["My/D sister/N.S is/V older/A than/C me/Pr.O.","Chị tôi lớn tuổi hơn tôi."],
["Today/N.S is/V hotter/A than/C yesterday/N.","Hôm nay nóng hơn hôm qua."],
["Maths/N.S is/V more/Adv difficult/A than/C Art/N.","Toán khó hơn Mỹ thuật."],
["Your/D drawing/N.S is/V better/A than/C mine/Pr.","Tranh của bạn đẹp hơn của tôi."],
["My/D cold/N.S is/V worse/A today/Adv.","Hôm nay tôi cảm nặng hơn."],
["Is/V a/D lion/N.S stronger/A than/C a/D tiger/N?","Sư tử có khỏe hơn hổ không?"]],
note:["<b>Lỗi thường gặp:</b> ❌ more bigger → ✅ <b>bigger</b> (không dùng cả more và -er). ❌ gooder → ✅ <b>better</b>. ❌ beautifuller → ✅ <b>more beautiful</b>. ❌ bigger then → ✅ bigger <b>than</b>."],
q:[
{t:"f",q:"A giraffe is ___ (tall) than a zebra.",a:["taller"],e:"tall + er → <b>taller</b>."},
{t:"f",q:"My bag is ___ (heavy) than your bag.",a:["heavier"],e:"-y → -ier: <b>heavier</b>."},
{t:"f",q:"July is ___ (hot) than January in Hanoi.",a:["hotter"],e:"Gấp đôi t: <b>hotter</b>."},
{t:"mc",q:"A car is ___ than a bike.",o:["expensiver","more expensive","most expensive"],a:1,e:"Tính từ dài → <b>more expensive</b>."},
{t:"mc",q:"My English is ___ than last year.",o:["gooder","better","more good"],a:1,e:"good → <b>better</b>."},
{t:"mc",q:"The weather today is ___ than yesterday. It's raining a lot.",o:["bad","worse","badder"],a:1,e:"bad → <b>worse</b>."},
{t:"mc",q:"Tom is taller ___ his brother.",o:["then","that","than"],a:2,e:"So sánh hơn dùng <b>than</b>."},
{t:"o",a:"A snail is slower than a mouse.",e:"Chủ ngữ + is + slower + than + danh từ."}]},

{id:"i3",lv:2,t:"Superlatives",vi:"So sánh nhất",
pic:{type:"cmp",items:[["🐭","small",30],["🐕","big",50],["🐘","the biggest",80]],cap:"The elephant is the biggest animal of the three."},
ex:[
"<b>So sánh nhất</b> dùng khi so sánh <b>từ ba</b> người/vật trở lên, để chỉ ra cái “nhất”. Luôn có [[the/D]] đứng trước.",
"<b>Tính từ ngắn:</b> the + adj-<b>est</b>: tall → the tallest, small → the smallest. Quy tắc chính tả giống so sánh hơn: nice → the nicest, big → the biggest, happy → the happiest.",
"<b>Tính từ dài:</b> the <b>most</b> + adj: the most beautiful, the most famous, the most dangerous.",
"<b>Bất quy tắc:</b> good → <b>the best</b>, bad → <b>the worst</b>, far → <b>the farthest</b>, many/much → <b>the most</b>, little → <b>the least</b>.",
"Thường đi kèm: <b>in</b> + nơi chốn/nhóm (the tallest <b>in</b> my class, the longest river <b>in</b> the world), <b>of</b> + số lượng (the youngest <b>of</b> the three), hoặc mệnh đề (the best film I have ever seen)."],
f:[["Tính từ ngắn","S:Chủ ngữ + V:be + D:the + A:adj-est + N:(danh từ) + P:in / of…"],["Tính từ dài","S:Chủ ngữ + V:be + D:the + Adv:most + A:adj + N:(danh từ)"]],
eg:[
["The/D blue_whale/N.S is/V the/D biggest/A animal/N in/P the/D world/N.","Cá voi xanh là động vật lớn nhất thế giới."],
["Lan/N.S is/V the/D tallest/A girl/N in/P my/D class/N.","Lan là bạn nữ cao nhất lớp tôi."],
["This/D is/V the/D most/Adv exciting/A book/N.","Đây là cuốn sách hấp dẫn nhất."],
["Sunday/N.S is/V the/D best/A day/N of/P the/D week/N.","Chủ nhật là ngày tuyệt nhất trong tuần."],
["That/D was/V the/D worst/A storm/N this/D year/N.","Đó là cơn bão tệ nhất năm nay."],
["Who/Q is/V the/D youngest/A in/P your/D family/N?","Ai là người nhỏ tuổi nhất nhà bạn?"]],
note:["<b>Lỗi thường gặp:</b> ❌ She is tallest girl. (thiếu the) → ✅ She is <b>the</b> tallest girl. ❌ the most biggest → ✅ <b>the biggest</b>. ❌ the goodest → ✅ <b>the best</b>.","<b>So sánh 2 hay 3?</b> 2 vật → so sánh hơn (-er/more). 3 vật trở lên → so sánh nhất (the -est/the most)."],
q:[
{t:"f",q:"Mount Everest is the ___ (high) mountain in the world.",a:["highest"],e:"<b>highest</b>."},
{t:"f",q:"This is the ___ (funny) film I've ever seen.",a:["funniest"],e:"-y → -iest: <b>funniest</b>."},
{t:"mc",q:"Sharks are one of the ___ animals in the sea.",o:["dangerousest","most dangerous","more dangerous"],a:1,e:"Tính từ dài → <b>most dangerous</b>."},
{t:"mc",q:"Linh is the ___ student in our class.",o:["better","best","goodest"],a:1,e:"good → <b>the best</b>."},
{t:"mc",q:"Tom is 10, Ben is 12 and Sam is 14. Sam is ___ .",o:["older","the oldest","oldest than"],a:1,e:"So sánh 3 người → <b>the oldest</b>."},
{t:"mc",q:"Ben is ___ than Tom.",o:["older","the oldest"],a:0,e:"So sánh 2 người → <b>older</b>."},
{t:"f",q:"January is the ___ (cold) month of the year here.",a:["coldest"],e:"<b>coldest</b>."},
{t:"o",a:"Which is the longest river in Vietnam?",e:"Which + is + the + longest + river + in + nơi chốn?"}]},

{id:"i4",lv:2,t:"Adverbs of Manner",vi:"Trạng từ chỉ cách thức",
pic:{type:"grid",items:[["🐢","walk slowly"],["🐆","run quickly"],["🎤","sing loudly"],["🤫","speak quietly"],["✍️","write carefully"],["⚽","play well"]]},
ex:[
"<b>Trạng từ chỉ cách thức</b> trả lời câu hỏi <b>“How?”</b> – hành động được làm <b>như thế nào</b>. Chúng bổ nghĩa cho <b>động từ</b> (khác với tính từ bổ nghĩa cho danh từ).",
"<b>Cách tạo:</b> tính từ + <b>-ly</b>: slow → slowly, quick → quickly, quiet → quietly, careful → carefully, loud → loudly, bad → badly. Tận cùng -y → -ily: happy → happily, easy → easily, noisy → noisily.",
"<b>Bất quy tắc:</b> good → <b>well</b>; fast → <b>fast</b>; hard → <b>hard</b>; early → early; late → late. (hardly và lately mang nghĩa khác!)",
"<b>Vị trí:</b> thường đứng <b>sau động từ</b>, hoặc <b>sau túc từ</b> nếu có túc từ: [[She/Pr.S]] [[sings/V]] [[beautifully/Adv]]. [[He/Pr.S]] [[opened/V]] [[the_door/N.O]] [[slowly/Adv]].",
"<b>So sánh tính từ và trạng từ:</b> [[He/Pr.S]] [[is/V]] [[a/D]] [[careful/A]] [[driver/N]]. (tính từ – bổ nghĩa cho driver) ↔ [[He/Pr.S]] [[drives/V]] [[carefully/Adv]]. (trạng từ – bổ nghĩa cho drives).",
"<b>So sánh hơn của trạng từ:</b> more slowly, more carefully, faster, harder, better (well → better → best)."],
f:[["Không có túc từ","S:Chủ ngữ + V:Động từ + Adv:Trạng từ"],["Có túc từ","S:Chủ ngữ + V:Động từ + O:Túc từ + Adv:Trạng từ"]],
eg:[
["The/D tortoise/N.S walks/V slowly/Adv.","Con rùa đi chậm."],
["My/D brother/N.S plays/V the/D piano/N.O very/Adv well/Adv.","Anh tôi chơi piano rất hay."],
["Please/Adv speak/V quietly/Adv in/P the/D library/N.","Hãy nói nhỏ trong thư viện."],
["She/Pr.S finished/V her/D test/N.O quickly/Adv.","Cô ấy làm xong bài kiểm tra nhanh chóng."],
["The/D children/N.S are/Aux laughing/V happily/Adv.","Bọn trẻ đang cười vui vẻ."],
["He/Pr.S works/V hard/Adv every_day/Adv.","Ông ấy làm việc chăm chỉ mỗi ngày."],
["Lisa/N.S is/V a/D good/A dancer/N. She/Pr.S dances/V well/Adv.","Lisa là người nhảy giỏi. Cô ấy nhảy hay."]],
note:["<b>Lỗi thường gặp:</b> ❌ He runs quick. → ✅ He runs <b>quickly</b>. ❌ She sings good. → ✅ She sings <b>well</b>. ❌ He works hardly (= hầu như không làm!) → ✅ He works <b>hard</b>.","Không đặt trạng từ giữa động từ và túc từ: ❌ She speaks well English → ✅ She speaks English <b>well</b>."],
q:[
{t:"f",q:"quiet → ___ (trạng từ)",a:["quietly"],e:"quiet + ly → <b>quietly</b>."},
{t:"f",q:"happy → ___ (trạng từ)",a:["happily"],e:"-y → -ily: <b>happily</b>."},
{t:"mc",q:"Mai is a good singer. She sings ___ .",o:["good","well","goodly"],a:1,e:"good → trạng từ <b>well</b>."},
{t:"mc",q:"Be careful! Drive ___ .",o:["careful","carefully"],a:1,e:"Bổ nghĩa cho động từ drive → trạng từ <b>carefully</b>."},
{t:"mc",q:"The test was ___ .",o:["easy","easily"],a:0,e:"Sau to be dùng tính từ <b>easy</b>."},
{t:"mc",q:"Cheetahs run very ___ .",o:["fast","fastly","faster than"],a:0,e:"fast là trạng từ bất quy tắc, giữ nguyên <b>fast</b>."},
{t:"o",a:"She closed the window quietly.",e:"Chủ ngữ + động từ + túc từ + trạng từ."},
{t:"mc",q:"Trong câu “He reads slowly.”, từ <b>slowly</b> bổ nghĩa cho:",o:["He","reads","không cho từ nào"],a:1,e:"Trạng từ bổ nghĩa cho <b>động từ</b> reads (đọc như thế nào? → chậm)."}]},

{id:"i6",lv:2,t:"Past Simple",vi:"Thì quá khứ đơn với động từ thường",

ex:[
"<b>Thì quá khứ đơn</b> diễn tả hành động <b>đã xảy ra và đã kết thúc</b> trong quá khứ, thường có thời gian rõ ràng.",
"<b>Động từ có quy tắc:</b> thêm <b>-ed</b>: play → played, watch → watched, walk → walked. Tận cùng -e: thêm -d (dance → danced, like → liked). Phụ âm + y: → -ied (study → studied, cry → cried, carry → carried). Một nguyên âm + một phụ âm: gấp đôi (stop → stopped, drop → dropped, shop → shopped).",
"<b>Động từ bất quy tắc</b> (phải thuộc): go → <b>went</b>, eat → <b>ate</b>, see → <b>saw</b>, have → <b>had</b>, do → <b>did</b>, make → <b>made</b>, take → <b>took</b>, buy → <b>bought</b>, come → <b>came</b>, get → <b>got</b>, give → <b>gave</b>, swim → <b>swam</b>, run → <b>ran</b>, write → <b>wrote</b>, drink → <b>drank</b>, sing → <b>sang</b>, fly → <b>flew</b>, catch → <b>caught</b>, find → <b>found</b>, think → <b>thought</b>, fall → <b>fell</b>, sleep → <b>slept</b>, read → <b>read</b> (đọc là /red/).",
"<b>Phủ định và câu hỏi</b> mượn trợ động từ [[did/Aux]] cho <b>mọi chủ ngữ</b>, động từ chính <b>trở về nguyên mẫu</b>: She went → She <b>didn't go</b> → <b>Did</b> she <b>go</b>?",
"<b>Dấu hiệu:</b> yesterday, last…, …ago, in + năm quá khứ, when + mệnh đề quá khứ."],
f:[["Khẳng định","S:Chủ ngữ + V:V-ed / V2 (cột 2) + O:…"],["Phủ định","S:Chủ ngữ + Aux:didn't + V:V nguyên mẫu + O:…"],["Câu hỏi","Aux:Did + S:Chủ ngữ + V:V nguyên mẫu + X:… ?"]],

["She/Pr.S went/V to/P the/D cinema/N yesterday/Adv.","Hôm qua cô ấy đi xem phim."],
["I/Pr.S ate/V a/D big/A pancake/N.O for/P breakfast/N.","Tôi đã ăn một cái bánh kếp to cho bữa sáng."],
["The/D cat/N.S caught/V a/D mouse/N.O.","Con mèo đã bắt được một con chuột."],

{id:"i7",lv:2,t:"Countable & Uncountable",vi:"Danh từ đếm được, không đếm được: some, any, much, many",
pic:{type:"grid",items:[["🍎🍎🍎","apples","đếm được"],["🥚🥚","eggs","đếm được"],["🥛","milk","không đếm được"],["🍚","rice","không đếm được"],["💧","water","không đếm được"],["🧀","cheese","không đếm được"]]},
ex:[
"<b>Danh từ đếm được</b> (countable): đếm được từng cái, có số ít và số nhiều: an apple, two apples, a chair, three chairs.",
"<b>Danh từ không đếm được</b> (uncountable): không đếm từng cái, <b>không có số nhiều</b>, không dùng a/an: water, milk, juice, rice, bread, cheese, sugar, money, homework, information, music, weather. Động từ chia <b>số ít</b>: The milk <b>is</b> cold.",
"Để đếm, dùng <b>đơn vị</b>: a glass of milk, a bottle of water, a bowl of rice, a piece of cake, a slice of bread, a cup of tea, a kilo of sugar.",
"[[some/D]] – một ít, vài: dùng trong câu <b>khẳng định</b> (và lời mời/đề nghị): There is some milk. Would you like some cake? · [[any/D]] – dùng trong câu <b>phủ định</b> và <b>câu hỏi</b>: There aren't any eggs. Have you got any money?",
"[[many/D]] + danh từ <b>đếm được số nhiều</b>: many books · [[much/D]] + danh từ <b>không đếm được</b>: much water (much thường dùng trong phủ định/câu hỏi). [[a_lot_of/D]] / lots of dùng được cho <b>cả hai</b>.",
"<b>Hỏi số lượng:</b> How many apples? · How much sugar?"],
f:[["Đếm được","D:many / a few / some / any + N:Danh từ số nhiều"],["Không đếm được","D:much / a little / some / any + N:Danh từ không đếm được"],["Cả hai","D:a lot of / lots of + N:Danh từ"]],
eg:[
["There/Pr is/V some/D bread/N.S on/P the/D table/N.","Có một ít bánh mì trên bàn."],
["We/Pr.S need/V some/D eggs/N.O for/P the/D cake/N.","Chúng ta cần vài quả trứng để làm bánh."],
["I/Pr.S haven't_got/V any/D money/N.O.","Tôi không có đồng nào."],
["Are/V there/Pr any/D bananas/N.S?","Có quả chuối nào không?"],
["She/Pr.S drinks/V a_lot_of/D water/N.O every_day/Adv.","Cô ấy uống nhiều nước mỗi ngày."],
["How_many/Q books/N.O have/Aux you/Pr.S got/V?","Bạn có bao nhiêu cuốn sách?"],
["We/Pr.S don't/Aux have/V much/D homework/N.O today/Adv.","Hôm nay chúng tôi không có nhiều bài tập."],
["Can/Aux I/Pr.S have/V a/D glass/N.O of/P orange_juice/N?","Cho tôi một ly nước cam được không?"]],

q:[
